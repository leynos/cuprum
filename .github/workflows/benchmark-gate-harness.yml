---
name: Benchmark gate harness

on:
  workflow_dispatch:
    inputs:
      workflow-harness:
        description: Run the benchmark gate runtime integration scenarios
        type: boolean
        required: false
        default: false
  # Isolate the compatibility check from CI's paid build and benchmark jobs.
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:
  workflow-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' || inputs.workflow-harness
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1

      # Cached under the worktree-local directories the Makefile pins, which is
      # what makes the dependency sync here a few seconds rather than a minute.
      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      # `act` is not in the runner image, and the scenario suite is skipped
      # rather than failed when it is absent — so an install that silently
      # stopped working would turn this job into a green run that tested
      # nothing. `CUPRUM_REQUIRE_ACT=1` below is the other half of that
      # guarantee: it refuses the skip and fails the job instead.
      - name: Install act
        shell: bash
        run: |
          set -euo pipefail
          readonly ACT_VERSION='0.2.89'
          readonly ACT_SHA256='0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0'
          readonly ACT_ARCHIVE='act_Linux_x86_64.tar.gz'
          readonly ACT_URL="https://github.com/nektos/act/releases/download/v${ACT_VERSION}/${ACT_ARCHIVE}"
          readonly ACT_DIR="${RUNNER_TEMP}/act"
          ACT_ARCHIVE_PATH="$(mktemp)"
          trap 'rm -f "${ACT_ARCHIVE_PATH}"' EXIT
          command curl --fail --location --show-error \
            --output "${ACT_ARCHIVE_PATH}" "${ACT_URL}"
          printf '%s  %s\n' "${ACT_SHA256}" "${ACT_ARCHIVE_PATH}" \
            | sha256sum --check --status
          mkdir -p "${ACT_DIR}"
          tar --extract --gzip --file "${ACT_ARCHIVE_PATH}" --directory "${ACT_DIR}" act
          printf '%s\n' "${ACT_DIR}" >> "${GITHUB_PATH}"

      # The runtime the scenarios bind to. The hosted image already installs
      # and starts Docker, so this step asserts rather than installs: it is
      # here to make a runner image that stopped starting its daemon fail at a
      # step named for the runtime, instead of at the skip refusal inside the
      # harness with no indication of which dependency moved. `docker info`
      # reaches the daemon, which a `command -v docker` would not.
      - name: Provide the container runtime
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}'

      - name: Pull the act runner image
        run: |
          docker pull \
            catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43

      # `make test-act` sets `CUPRUM_REQUIRE_ACT=1`, so a missing act binary,
      # a missing runtime, or a missing socket fails here rather than turning
      # every scenario into a skip. A green run of this job therefore means
      # the scenarios ran.
      - name: Run the workflow integration harness
        run: make test-act
