---
name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  # Queue rather than cancel. A re-pushed tag that cancelled the running
  # release could stop it part-way through an upload. The queued run then
  # starts from a complete state, and the reconciliation below makes it safe to
  # repeat.
  cancel-in-progress: false

# Every job declares exactly what it needs, so nothing inherits a write scope.
permissions: {}

# Each filename's canonical bytes are the ones already published: PyPI's
# first, then a GitHub asset with verified build provenance. This run's
# attested file stays in place when its digest matches GitHub's; an unverified
# differing asset stops PyPI staging. Each destination receives only names it
# lacks, never overwriting, and `publish-release` checks both hold the same
# digests before the release becomes visible. The decisions live in
# `scripts/release_assets.py`; network calls stay in these steps. Every phase
# writes a telemetry record through `.github/actions/release-telemetry`. YAML
# anchors (`&name`, `*name`) share the steps several jobs repeat verbatim.
jobs:
  # Runs beside the build rather than before it, so the paid build lane never
  # queues behind a hosted job; every job that attests, uploads, or releases
  # waits on it instead.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.cargo-version.outputs.version }}
      prerelease: ${{ steps.pyproject-version.outputs.prerelease }}
    steps:
      - &phase-clock
        name: Start the phase clock
        run: echo "PHASE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Pinned to shared-actions `main` at 2026-09-04, the revision this
      # repository's other shared-actions pins use. The tag loses its `v` and
      # is compared with the manifest as a string, so `v0.2.0-beta1` matches
      # `0.2.0-beta1` and any other spelling fails.
      - name: Check the Cargo manifest version against the tag
        id: cargo-version
        uses: leynos/shared-actions/.github/actions/ensure-cargo-version@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          manifests: rust/cuprum-rust/Cargo.toml
      # The shared validator for pyproject.toml exists only inside
      # `release-to-pypi-uv`, which also publishes, so the script repeats it.
      - name: Check the pyproject.toml version against the tag
        id: pyproject-version
        env:
          TAG_VERSION: ${{ steps.cargo-version.outputs.version }}
        run: python3 scripts/release_version.py
      # Checked first here so a runner with an old CLI fails before the PyPI
      # upload, rather than after it, when only a draft Release is left to fix.
      - name: Check the GitHub CLI version
        id: gh-version
        run: gh --version | python3 scripts/release_gh_version.py
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: check_version
          job-status: ${{ job.status }}
          steps: >-
            version_mismatch=${{ steps.cargo-version.outcome }}
            version_mismatch=${{ steps.pyproject-version.outcome }}
            version_mismatch=${{ steps.gh-version.outcome }}

  build-wheels:
    permissions:
      contents: read
    uses: ./.github/workflows/build-wheels.yml
    with:
      python-version: '3.13'

  # Attests exactly the files this run built, before anything leaves the run,
  # and hands them on as one artefact. Bytes a later job carries over from an
  # earlier run were attested by that run; every run's attestation stays in
  # the repository's attestation store, and its bundle is kept under a
  # run-unique name so no release asset is ever overwritten.
  attest:
    needs:
      - check-version
      - build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - *phase-clock
      - &scripts-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/actions/release-telemetry
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
      - name: Collect release artefacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/publish
          find dist -path dist/publish -prune -o -type f \
            \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | \
            xargs -0 -r -I {} cp {} dist/publish/
          shopt -s nullglob
          sdists=(dist/publish/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one source distribution." >&2
            ls -al dist/publish >&2
            exit 1
          fi
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          bundle="cuprum-${GITHUB_REF_NAME}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${BUNDLE_PATH}" "dist/attestations/${bundle}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: handoff
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          if-no-files-found: error
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: attest
          job-status: ${{ job.status }}
          steps: >-
            collection=${{ steps.collect.outcome }}
            attestation=${{ steps.provenance.outcome }}
            upload=${{ steps.handoff.outcome }}

  # Creates or reuses the draft and snapshots its assets, so the PyPI job can
  # carry GitHub's bytes over without a GitHub token of its own. A draft is
  # visible only to a token that can write contents.
  draft-release:
    needs:
      - check-version
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *phase-clock
      - *scripts-checkout
      - &release-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create or reuse the draft release
        id: create
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run reuses whatever release the tag already has, draft or not.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Reusing the existing release for ${GITHUB_REF_NAME}."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${IS_PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
      - name: Snapshot the release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          gh release view "${GITHUB_REF_NAME}" --json assets > github-state/assets.json
          python3 -m scripts.release_assets_cli carryover --publish dist/publish \
            --assets github-state/assets.json > github-state/carryover.txt
          while IFS= read -r name; do
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt
      - name: Verify carried asset provenance
        id: attestation
        run: |
          set -euo pipefail
          carryover_file=github-state/carryover.txt
          if [ ! -f "${carryover_file}" ]; then
            echo "::error title=attestation::Carryover list is missing." >&2
            exit 1
          fi
          mkdir -p github-state/provenance
          verification_failures=0
          if [ ! -s "${carryover_file}" ]; then
            echo "verification_failures=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 2.102.0 fixes GHSA-wjmr-j3rp-mh2g and GHSA-4mq3-hpgx-9cx8.
          required_version=2.102.0
          gh_version="$(gh --version | awk 'NR == 1 {print $3}')"
          lowest_version="$(printf '%s\n%s\n' "${required_version}" "${gh_version}" \
            | sort -V | sed -n '1p')"
          if [ "${lowest_version}" != "${required_version}" ]; then
            echo "::error title=gh-version::GitHub CLI ${required_version} or newer is required;" \
              "found ${gh_version:-unknown}." >&2
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            record="github-state/provenance/${name}.json"
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "github-state/files/${name}" \
                --repo "${GH_REPO}" \
                --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
                --source-ref "${GITHUB_REF}" \
                --deny-self-hosted-runners \
                --format json > "${record}"; then
                verified=true
                break
              fi
              rm -f "${record}"
              if [ "${attempt}" -lt 3 ]; then
                sleep "$((attempt * 2))"
              fi
            done
            if [ "${verified}" != true ]; then
              verification_failures=$((verification_failures + 1))
              echo "::warning title=attestation::Could not verify provenance for GitHub asset ${name};" \
                "stage-pypi will reject it if PyPI needs its differing bytes."
            fi
          done < "${carryover_file}"
          echo "verification_failures=${verification_failures}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        id: handoff
        with:
          name: release-github-state
          path: github-state
          if-no-files-found: error
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: draft_release
          job-status: ${{ job.status }}
          steps: >-
            github_api=${{ steps.create.outcome }}
            github_api=${{ steps.snapshot.outcome }}
            attestation=${{ steps.attestation.outcome }}
            upload=${{ steps.handoff.outcome }}
          verification-failures: ${{ steps.attestation.outputs.verification_failures }}

  publish-pypi:
    needs:
      - attest
      - draft-release
    # Release orchestration: it uploads the artefacts other jobs built. No
    # build work, so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/cuprum/
    permissions:
      contents: read
      id-token: write
    steps:
      - *phase-clock
      - *scripts-checkout
      - *release-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state
      # `publish-release` reuses this script through its anchor. The runner's
      # curl cannot report `%{num_retries}`, so the loop retries a network
      # error, 429, or 5xx itself and counts the attempts for telemetry.
      - name: Fetch the PyPI index
        id: index
        run: &fetch-index |
          set -euo pipefail
          attempt=0
          status=000
          while [ "${attempt}" -lt 6 ]; do
            attempt=$((attempt + 1))
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output pypi-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://pypi.org/simple/cuprum/) || status=000
            case "${status}" in
              000|429|5??) [ "${attempt}" -lt 6 ] && sleep 2 ;;
              *) break ;;
            esac
          done
          printf 'attempts=%s\nstatus=%s\n' "${attempt}" "${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            200) ;;
            404) echo '{"files": []}' > pypi-index.json ;;
            *)
              echo "PyPI simple index returned HTTP ${status}." >&2
              exit 1
              ;;
          esac
      # PyPI rejects a second upload of an existing filename, so names it holds
      # are dropped, and a name only the GitHub Release holds is sent with
      # GitHub's bytes rather than this run's rebuild.
      - name: Skip artefacts already on PyPI
        id: pending
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli stage-pypi --publish dist/publish \
            --index pypi-index.json --assets github-state/assets.json \
            --github-files github-state/files \
            --provenance github-state/provenance
      # pypa's action rather than `uv publish`: with Trusted Publishing it also
      # signs and uploads a PEP 740 attestation for every file, which uv does
      # not. `skip-existing` takes the place of uv's `--check-url`, so a file
      # an interrupted earlier attempt already uploaded is skipped, not fatal.
      - name: Publish to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/publish/
          skip-existing: true
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: publish_pypi
          job-status: ${{ job.status }}
          attempts: ${{ steps.index.outputs.attempts }}
          http-status: ${{ steps.index.outputs.status }}
          steps: >-
            index_http=${{ steps.index.outcome }}
            digest_mismatch=${{ steps.pending.outcome }}
            upload=${{ steps.upload.outcome }}

  # Runs only once PyPI holds every artefact, so the release's missing assets
  # take PyPI's bytes, and the release stays a draft unless both destinations
  # then agree.
  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *phase-clock
      - *scripts-checkout
      - *release-dist
      - name: Fetch the PyPI index
        id: index
        run: *fetch-index
      - name: List the release assets
        id: assets
        run: gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
      - name: Stage the assets the release lacks
        id: stage
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli stage-github --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations --output github-upload > pypi-fetch.tsv
          while IFS=$'\t' read -r name url; do
            curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"
          done < pypi-fetch.tsv
      - name: Check the fetched PyPI bytes
        id: fetched
        run: |
          python3 -m scripts.release_assets_cli check-fetched --publish dist/publish \
            --index pypi-index.json --assets release-assets.json --output github-upload
      # PyPI's index digest proves only that the download arrived intact, not
      # who built the bytes. The release must carry only bytes this
      # repository's workflow attested for this tag and this commit, so every
      # fetched file is verified before it is uploaded. The evidence is kept
      # outside `github-upload/` so it never becomes a release asset.
      - name: Verify provenance of PyPI bytes
        id: pypi-provenance
        run: |
          set -euo pipefail
          gh --version | python3 scripts/release_gh_version.py
          mkdir -p pypi-provenance
          failed=0
          while IFS=$'\t' read -r name url; do
            [ -n "${name}" ] || continue
            record="pypi-provenance/${name}.json"
            if ! gh attestation verify "github-upload/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json > "${record}"; then
              rm -f "${record}"
              echo "::error title=pypi-provenance::Could not verify build provenance" \
                "for ${name}." >&2
              failed=1
            fi
          done < pypi-fetch.tsv
          # Verify every file before stopping, so one run names every
          # unattested file rather than only the first one it meets.
          [ "${failed}" -eq 0 ] || exit 1
          python3 -m scripts.release_assets_cli check-provenance --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --output github-upload --provenance pypi-provenance
      # No `--clobber`: an asset the release already holds is canonical.
      - name: Upload the assets the release lacks
        id: upload
        if: steps.stage.outputs.pending == 'true'
        run: gh release upload "${GITHUB_REF_NAME}" github-upload/*
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: github_upload
          job-status: ${{ job.status }}
          upload: 'false'
          attempts: ${{ steps.index.outputs.attempts }}
          http-status: ${{ steps.index.outputs.status }}
          steps: >-
            index_http=${{ steps.index.outcome }}
            github_api=${{ steps.assets.outcome }}
            index_http=${{ steps.stage.outcome }}
            digest_mismatch=${{ steps.fetched.outcome }}
            attestation=${{ steps.pypi-provenance.outcome }}
            upload=${{ steps.upload.outcome }}
      - name: Check both destinations hold the same bytes
        id: verify
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          python3 -m scripts.release_assets_cli verify --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --bundles dist/attestations
      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false \
            --prerelease="${IS_PRERELEASE}"
      - uses: ./.github/actions/release-telemetry
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          operation: publish_release
          job-status: ${{ job.status }}
          steps: >-
            digest_mismatch=${{ steps.verify.outcome }}
            github_api=${{ steps.publish.outcome }}
