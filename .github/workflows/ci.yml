name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs exist to measure warm caches on `main` without a code change.
  # A dispatch restores every cache and saves none, because the save guards
  # require a `push` event, so repeated dispatches read the trusted generation
  # instead of churning it. `coverage` stays pull-request-only; the trunk
  # coverage run has its own dispatchable workflow.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# One run per ref. Superseded pull-request runs are cancelled, because a
# stale run only spends paid benchmark minutes on a diff nobody will merge.
# Runs on `main` are not cancelled once started: each one republishes the
# `benchmark-ratchet-main-baseline` artifact that pull-request runs compare
# against, and a half-finished run would leave the baseline behind head.
#
# That is the whole of what this buys. GitHub replaces a *pending* run when a
# newer one arrives and does not promise runs finish in the order they were
# queued, so this is not an ordering guarantee: two merges in quick
# succession may still publish out of commit order, and a superseded pending
# run publishes nothing at all. Anything that needs monotonic baselines has
# to enforce it where the artifact is written, not here.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Makefile defaults RUFF_VERSION and TY_VERSION with `?=`, so these
# workflow-level values are what every `make` invocation below actually
# runs. The pin-parity contract test in
# cuprum/unittests/test_toolchain_pins.py keeps them aligned with the
# Makefile defaults and the pyproject.toml dev dependencies.
env:
  RUFF_VERSION: '0.16.4'
  TY_VERSION: '0.0.74'
  MARKDOWNLINT_VERSION: '0.20.0'
  # Every Ubicloud job in this workflow runs on `ubicloud-standard-2`, so one
  # constant sizes nextest's test threads and Cargo's build jobs to the vCPUs
  # the job is actually billed for. Raising the label means raising this too.
  LINUX_RUNNER_VCPUS: '2'
  # Schema generation for every cache key family below. Bump it to invalidate
  # the whole family deliberately rather than by editing individual keys.
  CACHE_GENERATION: v1
  # Ubicloud's default image is Ubuntu 24.04 (glibc 2.39). Compiled tools
  # restored from a 22.04 archive would fail at run time, so the release is
  # part of every key that carries an executable.
  UBUNTU_RELEASE: ubuntu2404

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      MBAKE_VERSION: '1.4.6'
      WHITAKER_INSTALLER_VERSION: '0.2.7'
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: lint

      # This job is GitHub-hosted, so these archives live in GitHub's cache
      # service rather than Ubicloud's. Every key carries `runner.environment`,
      # so the two lanes cannot restore each other's entries even though they
      # share a family name, and each lane has its own single writer.
      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Cache npm CLI dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: cuprum-npm-cli-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            cuprum-npm-cli-${{ runner.os }}-

      # The checksum-verified installer, not the shared action's, so that
      # `RUSTC_WRAPPER` reaches `make lint` and the cranelift-built Whitaker
      # suite the same way it reaches the test gates. Run 33748907011 recorded
      # zero compile requests and `Local disk` here, meaning the wrapper never
      # reached the clippy and Whitaker builds at all.
      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Install CLI tools
        run: |
          uv tool install "mbake==${MBAKE_VERSION}"
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_VERSION}"

      # `cache-provider: external`, so the shared action archives neither the
      # Cargo registry nor `target/${BUILD_PROFILE}`. This job owns the
      # registry; nothing owns `target`, because sccache owns compiler output.
      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@f6d4d5f549655c118f86f371b8d55c200d3efa50
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'

      - name: Cache Whitaker installation
        id: cache-whitaker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.local/bin/whitaker
            ~/.dylint_drivers
            ~/.local/share/whitaker
          key: whitaker-v5-${{ runner.os }}-${{ env.WHITAKER_INSTALLER_VERSION }}

      - name: Install Whitaker
        run: |
          if [ "${{ steps.cache-whitaker.outputs.cache-hit }}" != "true" ]; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked \
                --disable-strategies compile \
                --git https://github.com/leynos/whitaker \
                --version "${WHITAKER_INSTALLER_VERSION}" \
                whitaker-installer
            else
              echo "cargo-binstall is required for the pinned prebuilt Whitaker installer" >&2
              exit 1
            fi
          fi
          whitaker-installer --cranelift

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run lint
        run: make lint

      # The Windows wheel build compiles this arm but without `-D warnings`,
      # so it catches a Windows arm that fails to build and nothing else. This
      # step is what holds the `#[cfg(windows)]` and `#[cfg(unix)]` branches to
      # the same warnings posture as the host.
      - name: Install the Windows target standard library
        run: rustup target add x86_64-pc-windows-msvc

      - name: Lint the Windows cfg branches
        run: make lint-windows

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Single writer for the GitHub-hosted lane, mirroring `typecheck-test`
      # on the Ubicloud lane. It is the only Linux gate here and the only one
      # that compiles, so there is nothing to race with.
      - name: Save the Cargo registry
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save the compiler cache
        # The only GitHub-hosted job that compiles, so it owns the whole
        # `github-hosted` compiler-cache scope; its Cranelift lint build is
        # also a shape no other job produces. Its archive lands in GitHub's
        # cache rather than Ubicloud's, which is the other reason the lane is
        # named in the key.
        #
        # The entry is a rolling generation named after the run, so there is
        # no cache-hit guard to skip: the key is new every time, and a run
        # that restored the previous generation republishes it with whatever
        # it added. The event guard is what keeps a pull request, or a
        # dispatch measuring warm caches, from publishing into a family it is
        # not trusted to own.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}

  typecheck-test:
    name: Typecheck and test (Python ${{ matrix.python-label }})
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `python-suite` is false only for the interpreter the coverage job
          # already runs pytest on. That leg keeps the typechecker, and its
          # required check name, without repeating a suite verbatim.
          - python-version: '3.12'
            python-label: '3.12'
            allow-prereleases: false
            experimental: false
            python-suite: true
          - python-version: '3.13'
            python-label: '3.13'
            allow-prereleases: false
            experimental: false
            python-suite: false
          - python-version: '3.14'
            python-label: '3.14'
            allow-prereleases: false
            experimental: false
            python-suite: true
          - python-version: '3.15'
            python-label: '3.15a'
            allow-prereleases: true
            experimental: true
            python-suite: true
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      # Started before the first cache restore, so the archive downloads and
      # every build below fall inside the measured window. `ubicloud-standard-2`
      # starts with about 31 GB free, and disk, not memory, is what kills a job
      # on this shape.
      - name: Start resource sampler
        uses: ./.github/actions/resource-sampler
        with:
          mode: start
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}
      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: ${{ matrix.python-version }}
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: debug

      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the installed tools
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}
          restore-keys: ${{ env.TOOL_CACHE_PREFIX }}

      # The compiler cache follows the Python suite. The leg that only
      # typechecks compiles nothing, so installing the wrapper there would
      # report zero compile requests, which reads as a broken integration
      # rather than as a job with nothing to compile.
      - name: Restore the compiler cache
        id: sccache-dir
        if: matrix.python-suite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      # Record the rendered key beside its result, so a reviewer can explain
      # any miss from the run summary alone rather than by re-deriving the
      # key from the workflow source.
      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| tools | %s | %s |\n' \
              "${TOOL_CACHE_KEY}" "${TOOL_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-not installed}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up sccache
        if: matrix.python-suite
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        if: matrix.python-suite
        run: sccache --zero-stats

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases }}

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: false

      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@f6d4d5f549655c118f86f371b8d55c200d3efa50
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'
          install-binstall: 'false'

      - name: Run typechecker
        run: make typecheck

      # `make test-python`, not `make test`: the Rust suite runs exactly once
      # per event, inside the coverage job, under instrumentation. This step is
      # also skipped on the interpreter the coverage job already runs, because
      # that would be the same suite on the same interpreter twice.
      #
      # `make test-python` defaults Cargo's job count to 1 for a developer
      # laptop sharing its cores with an editor. On a dedicated runner the job
      # is billed for `LINUX_RUNNER_VCPUS` vCPUs whether or not it uses them.
      # pytest itself stays serial: its batches compile and reuse the same
      # Cargo target directory, so xdist workers would contend on one build
      # lock rather than overlap.
      - name: Run tests
        if: matrix.python-suite
        run: |
          make test-python \
            PYTEST_CARGO_BUILD_JOBS="${LINUX_RUNNER_VCPUS}"

      - name: Record compiler-cache effectiveness
        if: always() && matrix.python-suite
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # One writer per key. This matrix is the only job that installs the whole
      # tool set (nextest included) on every supported interpreter, so it owns
      # the tool archive; every other job restores it. Saving only on `main`,
      # and only after a miss, keeps pull requests from racing each other for a
      # key they are not trusted to publish.
      - name: Save the installed tools
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}

      - name: Save the compiler cache
        # Each leg that runs the Python suite compiles the extension against
        # its own interpreter, and `pyo3` is built without `abi3`, so those
        # objects serve no other leg. The interpreter is part of the key, so
        # each leg is the sole writer of its own family rather than four legs
        # racing for one. The typecheck-only leg compiles nothing and has no
        # compiler cache to save.
        #
        # The entry is a rolling generation named after the run, so there is
        # no cache-hit guard to skip: the key is new every time, and a run
        # that restored the previous generation republishes it with whatever
        # it added. The event guard is what keeps a pull request, or a
        # dispatch measuring warm caches, from publishing into a family it is
        # not trusted to own.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.python-suite
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}

      # Last, and unconditional, so a job that failed on disk still reports the
      # high-water mark that explains why.
      - name: Report peak resource use
        if: always()
        uses: ./.github/actions/resource-sampler
        with:
          mode: report
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}

  extension-tests:
    name: Extension-gated tests (Python/Rust boundary)
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # This job compiles and runs repository code, so the checkout token
          # must not stay in .git/config where that code could reach it.
          persist-credentials: false

      # Started before the first cache restore, so the archive downloads and
      # every build below fall inside the measured window. `ubicloud-standard-2`
      # starts with about 31 GB free, and disk, not memory, is what kills a job
      # on this shape.
      - name: Start resource sampler
        uses: ./.github/actions/resource-sampler
        with:
          mode: start
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}
      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: debug

      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the installed tools
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}
          restore-keys: ${{ env.TOOL_CACHE_PREFIX }}

      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      # Record the rendered key beside its result, so a reviewer can explain
      # any miss from the run summary alone rather than by re-deriving the
      # key from the workflow source.
      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| tools | %s | %s |\n' \
              "${TOOL_CACHE_KEY}" "${TOOL_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: false

      # `make develop` compiles the extension, so this job needs the same
      # pinned toolchain the other Rust-touching jobs use rather than whatever
      # the runner image happens to ship.
      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@f6d4d5f549655c118f86f371b8d55c200d3efa50
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'
          install-binstall: 'false'

      - name: Prepare Cargo dependencies
        run: cargo fetch --locked --manifest-path rust/cuprum-rust/Cargo.toml

      # `make build` only syncs dependencies; `make develop` compiles the PyO3
      # extension into the same virtual environment. It is the target
      # contributors run locally, so this job cannot drift from local setup.
      - name: Build the native extension
        run: CARGO_BUILD_JOBS="${LINUX_RUNNER_VCPUS}" make develop

      # These modules are gated on `cuprum._rust_backend_native` being
      # importable and skip silently without it, so before this job existed a
      # green run was indistinguishable from one that never exercised the
      # Python/Rust boundary. `CUPRUM_REQUIRE_RUST_EXTENSION` turns a missing
      # extension into a failure, so the gate cannot close again unnoticed.
      #
      # The behavioural modules are covered too: without an extension the
      # `rust_streams` fixture skips their consumer-facing scenarios, the
      # dispatcher scenarios skip on `requires_rust_backend`, and
      # test_rust_extension_behaviour returns before comparing against the
      # installed native module — so they were never boundary coverage in the
      # ordinary test jobs either.
      #
      # The module list itself lives in the Makefile's EXTENSION_TEST_TARGETS,
      # so this job and the documented local command cannot drift apart. It is
      # deliberately not the whole suite: with the extension present,
      # `test_pipeline.py` trips the FD close race tracked by issue #124
      # (roadmap 8.1.1) and aborts the interpreter.
      - name: Run extension-gated tests
        run: make test-extension

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This is the heaviest Rust gate that runs on `main`: it resolves the
      # locked graph and compiles the extension. It therefore owns the Cargo
      # registry key. Every other job restores it.
      - name: Save the Cargo registry
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save the compiler cache
        # This job is the only one that builds the unoptimized extension
        # against Python 3.13, so it owns the `py3.13-debug` compiler-cache
        # family. Before this step existed the family had no writer at all
        # and every reader of it was permanently cold.
        #
        # The entry is a rolling generation named after the run, so there is
        # no cache-hit guard to skip: the key is new every time, and a run
        # that restored the previous generation republishes it with whatever
        # it added. The event guard is what keeps a pull request, or a
        # dispatch measuring warm caches, from publishing into a family it is
        # not trusted to own.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}

      # Last, and unconditional, so a job that failed on disk still reports the
      # high-water mark that explains why.
      - name: Report peak resource use
        if: always()
        uses: ./.github/actions/resource-sampler
        with:
          mode: report
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}

  coverage:
    # Pull requests only. Pushes to main are handled by coverage-main.yml,
    # which also uploads the report to CodeScene; guarding here stops
    # coverage being generated twice on main.
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    needs:
      - lint-test
      - typecheck-test
    env:
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # Full history so a future CodeScene changed-line gate
          # (cs-coverage check) can reach the pull request merge base.
          fetch-depth: 0
          persist-credentials: false

      # Started before the first cache restore, so the archive downloads and
      # every build below fall inside the measured window. `ubicloud-standard-2`
      # starts with about 31 GB free, and disk, not memory, is what kills a job
      # on this shape.
      - name: Start resource sampler
        uses: ./.github/actions/resource-sampler
        with:
          mode: start
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}
      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: coverage

      # Pull requests only, so this job never saves: it reads the generation
      # that the `main` writers published and publishes nothing of its own.
      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the installed tools
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}
          restore-keys: ${{ env.TOOL_CACHE_PREFIX }}

      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      # Record the rendered key beside its result, so a reviewer can explain
      # any miss from the run summary alone rather than by re-deriving the
      # key from the workflow source.
      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| tools | %s | %s |\n' \
              "${TOOL_CACHE_KEY}" "${TOOL_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: false

      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@f6d4d5f549655c118f86f371b8d55c200d3efa50
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'
          install-binstall: 'false'

      - name: Prepare Cargo dependencies
        run: cargo fetch --locked --manifest-path rust/cuprum-rust/Cargo.toml

      - name: Install code
        run: make build

      # Python-only coverage via the shared action. cuprum's repository
      # root has no Cargo.toml (the Rust workspace lives under rust/), so
      # detect.py classifies it as a Python project; cobertura is
      # mandatory for non-Rust projects. pytest runs serially
      # (pytest-workers: '') because the suite builds and shells out to
      # the Rust toolchain, and the ratchet fails the run if line
      # coverage drops materially below the baseline that coverage-main.yml
      # stores. The pinned action persists a fresh baseline per main run and
      # treats changes within one percentage point as measurement noise.
      #
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@f6d4d5f549655c118f86f371b8d55c200d3efa50
        env:
          # The same warnings posture and the same core budget the
          # uninstrumented run used.
          RUSTFLAGS: -D warnings
          CARGO_BUILD_JOBS: ${{ env.LINUX_RUNNER_VCPUS }}
          NEXTEST_TEST_THREADS: ${{ env.LINUX_RUNNER_VCPUS }}
        with:
          format: cobertura
          output-path: coverage.xml
          pytest-workers: ''
          cache-provider: external
          with-ratchet: 'true'
          # This job is the only execution of the Rust suite for the event.
          # `language: mixed` and the workspace manifest are what make the
          # shared action run it: the repository root has no Cargo.toml, so
          # detection alone would classify Cuprum as Python-only and skip the
          # Rust tests entirely.
          #
          # `all-targets` and `all-features` match the flags the uninstrumented
          # run used, so nothing silently drops out of the gate. `doctests`
          # covers what `cargo llvm-cov nextest` skips.
          language: mixed
          cargo-manifest: rust/Cargo.toml
          all-targets: 'true'
          all-features: 'true'
          doctests: 'true'

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@18bed1ca49a6de3d8882bd72635a32ae3f023d57
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/74471
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # `llvm-cov`'s target tree has no consumer once the report is written,
      # and it is the second tree on a volume this job leaves 89% full.
      # Removed before any cache save, so no archive carries it and the
      # sampler's least-free figure reflects the job's real high-water mark
      # rather than scratch that was about to be discarded.
      - name: Discard the instrumented build tree
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          df -h .
          # `cargo llvm-cov` builds beside the manifest it was given, which is
          # `rust/Cargo.toml` here and not the repository root. Locating the
          # tree rather than naming it keeps the reclaim correct if the
          # manifest moves, and reporting the size keeps a run that reclaimed
          # nothing distinguishable from one that had nothing to reclaim.
          found=0
          while IFS= read -r tree; do
            found=1
            du -sh "${tree}" || true
            rm --recursive --force "${tree}"
          done < <(find . -maxdepth 4 -type d \
            \( -name llvm-cov-target -o -name llvm-cov \) -prune -print)
          if [ "${found}" -eq 0 ]; then
            echo "No instrumented build tree found to discard"
          fi
          df -h .

      # Last, and unconditional, so a job that failed on disk still reports the
      # high-water mark that explains why.
      - name: Report peak resource use
        if: always()
        uses: ./.github/actions/resource-sampler
        with:
          mode: report
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}

  # Detects whether performance-relevant paths changed so that
  # benchmark-ratchet can skip docs-only and Dependabot-batch pull
  # requests. Runs on every event (cheap, GitHub-hosted) so that the
  # `needs` edge never leaves benchmark-ratchet skipped on pushes to
  # main, where the baseline artifact must stay fresh.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Detect performance-relevant changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            bench:
              - 'cuprum/**'
              - 'rust/**'
              - 'benchmarks/**'
              - 'conftest.py'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

      # A skipped job is indistinguishable from a broken gate in the run
      # list, so record the decision where a maintainer auditing paid-runner
      # spend can read it: the run summary of every CI run. Every field is a
      # closed set, so the summaries stay countable across runs — `decision`
      # in particular is exactly {run, skip, skip-detector-failed}.
      #
      # `!cancelled()` rather than the implicit `success()`: a failed
      # detector is the case most worth recording, because `benchmark-ratchet`
      # then skips for a reason that has nothing to do with the diff, and a
      # summary that stops being written precisely when the gate misbehaves
      # records the runs that needed no explanation.
      - name: Record the benchmark gate decision
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BENCH: ${{ steps.filter.outputs.bench }}
          DETECTOR: ${{ steps.filter.outcome }}
        run: |
          set -euo pipefail
          detector="${DETECTOR:-unknown}"
          if [ "${detector}" != 'success' ]; then
            decision=skip-detector-failed
          elif [ "${EVENT}" != 'pull_request' ] || [ "${BENCH}" = 'true' ]; then
            decision=run
          else
            decision=skip
          fi
          if [ "${EVENT}" = 'pull_request' ]; then
            event_class=pull_request
          else
            event_class=other
          fi
          case "${detector}" in
            success|failure) detector_status="${detector}" ;;
            *) detector_status=unknown ;;
          esac
          {
            printf '### Benchmark gate\n\n'
            printf '| event | detector | performance-relevant changes |'
            printf ' benchmark-ratchet |\n'
            printf '| --- | --- | --- | --- |\n'
            printf '| %s | %s | %s | %s |\n' \
              "${EVENT}" "${detector}" "${BENCH:-unknown}" "${decision}"
          } >> "${GITHUB_STEP_SUMMARY}"
          printf '%s\n' \
            "::notice title=benchmark-gate-decision::event_class=${event_class} detector_status=${detector_status} decision=${decision}"

  benchmark-ratchet:
    # The ratchet compares each scenario's within-run `rust_mean / python_mean`
    # ratio between the baseline and the candidate, so runner speed cancels out
    # of the comparison and the job does not need a fixed or larger shape. It
    # therefore starts at the estate default like every other Linux gate.
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    needs:
      - lint-test
      - typecheck-test
      - changes
    # Benchmarks are the estate's dominant paid-runner cost, and most CI
    # runs (Dependabot dev-dependency bumps, docs edits) cannot change
    # pipeline throughput. Successful pushes to main always run so the ratchet
    # baseline artifact is refreshed for every merge. A failed detector skips
    # every event, rather than spending paid-runner time on an ungated run.
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.bench == 'true')
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
          # The benchmark does not need repository credentials after checkout.
          # Keep its scoped token out of later build commands.
          persist-credentials: false

      # No resource sampler here, deliberately. This job times commands that
      # run for about half a second and compares the ratio of two of them, so
      # a background loop waking every 15 s to shell out to `free` and `df` is
      # interference in the measurement rather than an observation of it. Its
      # disk figure was taken once, in run 33857764655: 62.1 GB used with
      # 11.0 GB free on the 72 GB volume, the same envelope as the other
      # Ubicloud jobs.

      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: release

      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the installed tools
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}
          restore-keys: ${{ env.TOOL_CACHE_PREFIX }}

      # No `target` archive. sccache owns compiler output for every build
      # shape in this repository, including this job's `--release` shape, so
      # `rust/target` stays disposable here as it is everywhere else.
      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| tools | %s | %s |\n' \
              "${TOOL_CACHE_KEY}" "${TOOL_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: false

      - name: Install hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install --yes hyperfine

      - name: Fetch latest main benchmark baseline
        id: baseline-artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/benchmark-ratchet"
          baseline_dir="${artifact_dir}/main-baseline"
          mkdir -p "${artifact_dir}"

          if UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-dev python \
            benchmarks/fetch_main_benchmark_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "ci.yml" \
            --artifact-name "benchmark-ratchet-main-baseline" \
            --output-dir "${baseline_dir}"
          then
            echo "baseline_available=true" >> "${GITHUB_OUTPUT}"
          else
            status=$?
            if [[ "${status}" -eq 3 ]]; then
              echo "baseline_available=false" >> "${GITHUB_OUTPUT}"
              echo "No previous successful main benchmark baseline artifact is available."
            else
              exit "${status}"
            fi
          fi

      - name: Run throughput benchmarks and ratchet comparison
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/benchmark-ratchet"
          mkdir -p "${artifact_dir}"

          run_smoke_benchmarks() {
            local workspace="$1"
            local prefix="$2"
            pushd "${workspace}" >/dev/null

            # `make develop` is the one definition of the extension build:
            # `make build`, then `ensurepip --upgrade`, then `maturin
            # develop`. The ratchet requests an optimized in-place build,
            # avoiding Maturin's unnecessary editable dependency install,
            # instead of restating the sequence. This runs after `pushd
            # "${workspace}"`, so the target's relative UV_CACHE_DIR and
            # UV_TOOL_DIR resolve against the same directory the inline
            # commands used. The benchmark needs maturin, but not the
            # lint-only df12 plugin; later commands preserve this prepared
            # environment instead of triggering another sync.
            CARGO_BUILD_JOBS="${LINUX_RUNNER_VCPUS}" \
              make develop MATURIN_DEVELOP_FLAGS='--release --skip-install' \
              UV_SYNC_FLAGS=--no-install-package=df12-python-lints \
              UV_RUN_FLAGS=--no-sync

            UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-sync python \
              benchmarks/pipeline_throughput.py \
              --smoke \
              --dry-run \
              --output "${artifact_dir}/${prefix}-full-plan.json"

            UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-sync python \
              benchmarks/ci_benchmark_ratchet_profile.py \
              --full-plan "${artifact_dir}/${prefix}-full-plan.json" \
              --filtered-plan "${artifact_dir}/${prefix}-plan.json" \
              --throughput "${artifact_dir}/${prefix}-throughput.json"

            popd >/dev/null
          }

          run_smoke_benchmarks "${GITHUB_WORKSPACE}" "candidate"

          if [[ "${{ steps.baseline-artifact.outputs.baseline_available }}" == "true" ]]; then
            pushd "${GITHUB_WORKSPACE}" >/dev/null
            UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-sync python \
              benchmarks/ratchet_rust_performance.py \
              --baseline-plan "${artifact_dir}/main-baseline/main-plan.json" \
              --baseline-throughput "${artifact_dir}/main-baseline/main-throughput.json" \
              --candidate-plan "${artifact_dir}/candidate-plan.json" \
              --candidate-throughput "${artifact_dir}/candidate-throughput.json" \
              --max-regression 0.30 \
              --output "${artifact_dir}/ratchet-report.json"
            popd >/dev/null
          else
            REPORT_PATH="${artifact_dir}/ratchet-report.json" \
            UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-sync python - <<'PY'
          import json
          import os
          import pathlib as pth

          report_path = pth.Path(os.environ["REPORT_PATH"])
          report_path.write_text(
              json.dumps(
                  {
                      "baseline_available": False,
                      "comparison_performed": False,
                      "passed": True,
                      "reason": "no_previous_main_benchmark_baseline",
                  },
                  indent=2,
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          fi

          cp "${artifact_dir}/candidate-plan.json" "${artifact_dir}/main-plan.json"
          cp "${artifact_dir}/candidate-throughput.json" "${artifact_dir}/main-throughput.json"

      - name: Generate benchmark comparison report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/benchmark-ratchet"

          # Only generate report if all required input files exist
          if [[ -f "${artifact_dir}/candidate-plan.json" ]] && \
             [[ -f "${artifact_dir}/candidate-throughput.json" ]] && \
             [[ -f "${artifact_dir}/ratchet-report.json" ]]; then
            UV_CACHE_DIR=.uv-cache UV_TOOL_DIR=.uv-tools uv run --no-sync python \
              benchmarks/python_vs_rust_comparison_report.py \
              --plan "${artifact_dir}/candidate-plan.json" \
              --throughput "${artifact_dir}/candidate-throughput.json" \
              --ratchet-report "${artifact_dir}/ratchet-report.json" \
              --output-json "${artifact_dir}/comparison-report.json" \
              --output-markdown "${artifact_dir}/comparison-summary.md"
          else
            echo "Skipping comparison report generation: required input files not found"
            echo "This usually indicates the benchmark run failed before completing"
          fi

      - name: Publish benchmark workflow summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/benchmark-ratchet"
          if [[ -f "${artifact_dir}/comparison-summary.md" ]]; then
            cat "${artifact_dir}/comparison-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark ratchet artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-ratchet
          path: |
            ${{ runner.temp }}/benchmark-ratchet/**/*.json
            ${{ runner.temp }}/benchmark-ratchet/**/*.md

      - name: Upload main benchmark baseline artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-ratchet-main-baseline
          path: |
            ${{ runner.temp }}/benchmark-ratchet/main-plan.json
            ${{ runner.temp }}/benchmark-ratchet/main-throughput.json

      - name: Save the compiler cache
        # This is the only job that builds the extension with `--release`, so
        # it owns the `py3.13-release` compiler-cache family. An optimized
        # object cannot serve an unoptimized build, which is why the shape is
        # part of the key rather than shared with `extension-tests`.
        #
        # The entry is a rolling generation named after the run, so there is
        # no cache-hit guard to skip: the key is new every time, and a run
        # that restored the previous generation republishes it with whatever
        # it added. The event guard is what keeps a pull request, or a
        # dispatch measuring warm caches, from publishing into a family it is
        # not trusted to own.
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}

  build-wheels:
    uses: ./.github/workflows/build-wheels.yml
    with:
      python-version: '3.13'
