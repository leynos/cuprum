---
name: delayed-pr-comment
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
      delay_minutes:
        description: 'Minutes to wait before commenting'
        required: true
      message:
        description: 'Comment body'
        required: true

jobs:
  delay_and_comment:
    # Deliberately stays on GitHub-hosted Ubuntu: this sleeps while holding a
    # runner and must not consume a metered Ubicloud build slot.
    runs-on: ubuntu-latest
    # Ten minutes above the 180-minute cap on `delay_minutes`, so the longest
    # accepted sleep still leaves the comment step time to run, while a
    # runaway job cannot hold a runner for GitHub's six-hour default. A delay
    # longer than the cap belongs in a scheduled workflow, not a sleeping job.
    timeout-minutes: 190
    permissions:
      pull-requests: write   # needed to post comments
    steps:
      - name: Convert minutes to seconds
        id: calc
        shell: bash
        env:
          DELAY_MINUTES: ${{ github.event.inputs.delay_minutes }}
        run: |
          set -euo pipefail
          # Refuse anything but a whole number before it reaches arithmetic.
          if ! [[ "${DELAY_MINUTES}" =~ ^[0-9]+$ ]]; then
            echo "delay_minutes must be a whole number of minutes." >&2
            exit 1
          fi
          # Bash arithmetic wraps at 64 bits, so bound the value before
          # multiplying. Stripping leading zeros keeps `007` valid and leaves
          # at most three digits to compare, so the comparison cannot wrap.
          minutes="${DELAY_MINUTES#"${DELAY_MINUTES%%[!0]*}"}"
          minutes="${minutes:-0}"
          if [ "${#minutes}" -gt 3 ] || [ "${minutes}" -gt 180 ]; then
            echo "delay_minutes must be at most 180." >&2
            exit 1
          fi
          echo "secs=$(( minutes * 60 ))" >> "$GITHUB_OUTPUT"
      - name: Wait requested time
        env:
          DELAY_SECONDS: ${{ steps.calc.outputs.secs }}
        run: sleep "${DELAY_SECONDS}"
        shell: bash
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          pr-number: ${{ github.event.inputs.pr_number }}
          message: ${{ github.event.inputs.message }}
