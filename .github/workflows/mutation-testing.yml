---
name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-mutmut-workflow.md.
#
# Only the Python package is covered. The Rust extension under rust/ is
# deliberately not enrolled: the pinned mutation-cargo.yml reusable
# workflow always fans a repository-root cargo-mutants target out for
# workflow_dispatch full runs, and cuprum has no repository-root
# Cargo.toml (the workspace manifest lives at rust/Cargo.toml), so those
# shards would fail on every manual run. Revisit once the shared
# workflow can target a workspace in a subdirectory.
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-python:
    permissions:
      contents: read
      id-token: write  # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-mutmut.yml@774cc5a01e457714aede66e14a97b3e257812fc2
    with:
      # Flat layout: the mutable source is the cuprum/ package at the
      # repository root, so change detection watches it directly.
      paths: "cuprum/"
      # Flat layout has no src/ prefix to strip before module-glob
      # translation.
      module-prefix-strip: ""
      # 3.7.0 is the first release whose async-generator trampoline forwards
      # close()/athrow() to the wrapped generator (boxed/mutmut#525). Under
      # 3.6.0 the wrapper only iterated, so a mutated async generator kept
      # its cleanup pending until loop shutdown and the unchanged-source
      # baseline failed in test_bounded_delivery_lines.
      mutmut-version: "3.7.0"

  # The shared workflow publishes its results listing and mutmut's statistics
  # file only after a successful run, so a failing baseline leaves no artefact
  # behind: the first actionable error survives only in the failed step's log,
  # which GitHub expires. This job reproduces the baseline on a runner and
  # keeps its output as an artefact. It runs only when the mutation run failed,
  # and mutmut's statistics phase executes the whole unchanged-source suite
  # before any mutant, so the pinned single-module glob cannot hide the error
  # the baseline hit.
  #
  # The shared prevention belongs in leynos/shared-actions#591; this keeps the
  # diagnosis available from cuprum's own run in the meantime.
  baseline-diagnostics:
    name: Mutation baseline diagnostics
    needs: mutation-python
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.13"

      - name: Reproduce the baseline and capture its output
        shell: bash
        run: |
          set -uo pipefail
          # A failing baseline stops the statistics phase, so this exits early
          # with mutmut's own dump of the failing run in both the step log and
          # the captured file. If the failure was transient, the glob bounds
          # the follow-on work instead of starting a second full sweep.
          timeout 3000 uv run --with mutmut==3.7.0 mutmut run \
            'cuprum._enum_parse.*' --max-children 1 2>&1 \
            | tee mutation-baseline-diagnostics.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload the baseline diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutation-baseline-diagnostics
          path: mutation-baseline-diagnostics.txt
          if-no-files-found: error
