name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push. Pull requests generate
# coverage in ci.yml's coverage job (ratchet only) instead. This
# workflow also advances the coverage ratchet baseline: caches saved on
# main are readable by every pull-request run, so the baseline written
# here is the one PR ratchet checks compare against.
#
# workflow_dispatch is intentional and required: merges performed by the
# automerge workflow's GITHUB_TOKEN do not fire push-event workflows, so
# automerged changes to main only get their coverage uploaded via a
# manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-baseline:
        description: >-
          Publish the ratchet baseline from this run; set false for
          cache-warming or measurement dispatches.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# These three values render the tool cache key. They must match ci.yml exactly,
# because this job restores the archive that ci.yml's `typecheck-test` writes;
# a contract test pins the equality so a bump in one file cannot silently make
# every run here cold.
env:
  CACHE_GENERATION: v1
  UBUNTU_RELEASE: ubuntu2404
  # This job now compiles and runs the Rust suite under instrumentation, so it
  # is bounded by the same vCPU budget as the pull-request coverage job.
  LINUX_RUNNER_VCPUS: '2'

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # Coverage generation runs project code; the scoped token must not
          # stay in .git/config where that code could read it.
          persist-credentials: false

      # Started before the first cache restore, so the archive downloads and
      # every build below fall inside the measured window. `ubicloud-standard-2`
      # starts with about 31 GB free, and disk, not memory, is what kills a job
      # on this shape.
      - name: Start resource sampler
        uses: ./.github/actions/resource-sampler
        with:
          mode: start
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}

      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: coverage

      # Restore only, both of these. This workflow and ci.yml both fire on a
      # push to `main`, so letting this job save either key would give it two
      # writers racing in the same event; ci.yml owns both.
      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the installed tools
        id: tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.local/bin
            ~/.cache/uv
            ~/.local/share/uv
            .uv-cache
            .uv-tools
          key: ${{ env.TOOL_CACHE_KEY }}
          restore-keys: ${{ env.TOOL_CACHE_PREFIX }}

      # This job runs the same coverage action as ci.yml's `coverage`, so it
      # compiles the workspace under instrumentation and needs the same
      # wrapper. It is also the sole writer of the family it reads: no job in
      # ci.yml saves an instrumented archive, and ci.yml's own `coverage` job
      # is pull-request-only and therefore never publishes. The save step at
      # the end of this job is that writer.
      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| tools | %s | %s |\n' \
              "${TOOL_CACHE_KEY}" "${TOOL_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      # Immediately after the wrapper exists, so nothing between setup and
      # the build can compile outside the measured window. `lint-test` built
      # the cranelift Whitaker suite before this ran, and those requests were
      # zeroed away before the report.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: false

      # The coverage run compiles the Rust workspace, so this job needs the
      # same pinned toolchain the pull-request coverage job uses rather than
      # whatever the runner image ships.
      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'
          install-binstall: 'false'

      - name: Install code
        run: make build

      # Python-only coverage (see the note in ci.yml's coverage job):
      # the repository root has no Cargo.toml, so the shared action
      # detects a Python project and cobertura is mandatory. The ratchet
      # writes the authoritative baseline that pull-request runs compare
      # against.
      # The pinned action writes a run-specific baseline cache entry and treats
      # changes within one percentage point as measurement noise.
      #
      # From this pin the action publishes only on a push to refs/heads/main.
      # This repository's merges are performed by the automerge workflow's
      # GITHUB_TOKEN, which fires no push event; see the header above. So the
      # manual dispatch that carries an automerged change has to opt back in, or
      # the ratchet every pull request is measured against stops advancing.
      #
      # A dispatch is also how warm-cache evidence is gathered, and such a run
      # must read the generation it is measuring rather than replace it. The
      # workflow_dispatch input decides which kind of dispatch this is: it
      # defaults to publishing, because carrying an automerged change is the
      # common case, and a measurement run sets it false.
      #
      # A push needs no opt-in, since the action's own guard already admits it;
      # naming it here keeps the rule readable in one place. The push trigger is
      # restricted to main, and a contract holds it there, so `always` cannot
      # reach another ref.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@77ea10341249024e22ec5d9069e3caa7596e0d4f
        env:
          # The same warnings posture and the same core budget the
          # uninstrumented run used.
          RUSTFLAGS: -D warnings
          CARGO_BUILD_JOBS: ${{ env.LINUX_RUNNER_VCPUS }}
          NEXTEST_TEST_THREADS: ${{ env.LINUX_RUNNER_VCPUS }}
        with:
          format: cobertura
          output-path: coverage.xml
          pytest-workers: ''
          cache-provider: external
          with-ratchet: 'true'
          publish-baseline: >-
            ${{ (github.event_name == 'push' || inputs.publish-baseline)
            && 'always' || 'auto' }}
          # This job is the only execution of the Rust suite for the event.
          # `language: mixed` and the workspace manifest are what make the
          # shared action run it: the repository root has no Cargo.toml, so
          # detection alone would classify Cuprum as Python-only and skip the
          # Rust tests entirely.
          #
          # `all-targets` and `all-features` match the flags the uninstrumented
          # run used, so nothing silently drops out of the gate. `doctests`
          # covers what `cargo llvm-cov nextest` skips.
          language: mixed
          cargo-manifest: rust/Cargo.toml
          all-targets: 'true'
          all-features: 'true'
          doctests: 'true'

      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          format: cobertura
          path: coverage.xml
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # This job owns the `py3.13-coverage` compiler-cache family, and only
      # that family. It runs the whole Rust suite under instrumentation, so on
      # `main` it is by a wide margin the heaviest compiler in the estate.
      #
      # It deliberately does not serve the uninstrumented jobs. Until
      # 2026-09-04 the compiler key named neither the interpreter nor the
      # build shape, so every Ubicloud job read this archive and only the one
      # that matched it, `extension-tests` on the same interpreter, got any
      # hits; the 3.12, 3.14 and 3.15a legs took none. Each shape now has its
      # own family and its own writer.
      #
      # The entry is a rolling generation named after the run, so there is no
      # cache-hit guard to skip: the key is new every time, and a run that
      # restored the previous generation republishes it with what it added.
      # `llvm-cov`'s target tree has no consumer once the report is written,
      # and it is the second tree on a volume this job leaves 89% full.
      # Removed before any cache save, so no archive carries it and the
      # sampler's least-free figure reflects the job's real high-water mark
      # rather than scratch that was about to be discarded.
      - name: Discard the instrumented build tree
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          df -h .
          # `cargo llvm-cov` builds beside the manifest it was given, which is
          # `rust/Cargo.toml` here and not the repository root. Locating the
          # tree rather than naming it keeps the reclaim correct if the
          # manifest moves, and reporting the size keeps a run that reclaimed
          # nothing distinguishable from one that had nothing to reclaim.
          found=0
          while IFS= read -r tree; do
            found=1
            du -sh "${tree}" || true
            rm --recursive --force "${tree}"
          done < <(find . -maxdepth 4 -type d \
            \( -name llvm-cov-target -o -name llvm-cov \) -prune -print)
          if [ "${found}" -eq 0 ]; then
            echo "No instrumented build tree found to discard"
          fi
          df -h .

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}

      # Last, and unconditional, so a job that failed on disk still reports the
      # high-water mark that explains why.
      - name: Report peak resource use
        if: always()
        uses: ./.github/actions/resource-sampler
        with:
          mode: report
          vcpus: ${{ env.LINUX_RUNNER_VCPUS }}
