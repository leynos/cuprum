---
name: Loom

on:
  # 17:15 UTC daily; UTC is deliberate and does not track Europe/London DST.
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: loom-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_GENERATION: v1
  UBUNTU_RELEASE: ubuntu2404

jobs:
  loom:
    name: Full bounded Loom models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compute cache keys
        uses: ./.github/actions/cache-keys
        with:
          python-version: '3.13'
          generation: ${{ env.CACHE_GENERATION }}
          ubuntu-release: ${{ env.UBUNTU_RELEASE }}
          compiler-shape: loom

      - name: Restore the Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: ${{ env.CARGO_CACHE_PREFIX }}

      - name: Restore the compiler cache
        id: sccache-dir
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
          restore-keys: ${{ env.SCCACHE_CACHE_PREFIX }}

      - name: Record cache observations
        if: always()
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          SCCACHE_CACHE_HIT: ${{ steps.sccache-dir.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### Cache observations\n\n'
            printf '| cache | key | hit |\n| --- | --- | --- |\n'
            printf '| registry | %s | %s |\n' \
              "${CARGO_CACHE_KEY}" "${CARGO_CACHE_HIT:-false}"
            printf '| sccache | %s | %s |\n' \
              "${SCCACHE_CACHE_KEY}" "${SCCACHE_CACHE_HIT:-false}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          enable-cache: false

      - name: Install Rust toolchain
        uses: leynos/shared-actions/.github/actions/setup-rust@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          toolchain: '1.85.0'
          cache-provider: external
          use-sccache: 'false'
          install-binstall: 'false'

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache

      - name: Reset compiler-cache counters
        run: sccache --zero-stats

      - name: Run full Loom models
        run: uv run scripts/run_loom.py --mode full --summary loom-summary.md

      - name: Record Loom model summary
        if: always()
        run: |
          if [[ -f loom-summary.md ]]; then
            cat loom-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '### Loom model summary\n\nThe Loom driver did not start.\n' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Record compiler-cache effectiveness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee sccache-stats.txt
          sccache --show-stats --stats-format json > sccache-stats.json
          fence='```'
          {
            printf '### sccache\n\n%stext\n' "${fence}"
            cat sccache-stats.txt
            printf '%s\n' "${fence}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save the compiler cache
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/sccache
          key: ${{ env.SCCACHE_CACHE_KEY }}
