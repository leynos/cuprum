# actionlint parses every path it is given as a workflow, so it is pointed at
# `.github/workflows` alone; a composite action under `.github/actions` has no
# `on:` or `jobs:` section and would fail the workflow schema. Yamllint has no
# such constraint and covers both directories.
#
# No setting here controls shell checking. That is command-line only: the lint
# target passes `-shellcheck=` to switch the integration off and avoid the
# v1.7.12 stdin deadlock (rhysd/actionlint#702, #704, #712).
self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - ubicloud-standard-2

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
# Empty array means no configuration variable is allowed, which is the posture
# here: no workflow reads `vars.*` any more, so any such reference is an
# actionlint error rather than an empty string at run time.

config-variables: []
