self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - ubicloud-standard-2

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
# Empty array means no configuration variable is allowed, which is the posture
# here: no workflow reads `vars.*` any more, so any such reference is an
# actionlint error rather than an empty string at run time.

config-variables: []
