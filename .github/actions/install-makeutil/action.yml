name: Install the Makefile parser
description: >-
  Download the pinned `makeutil` release, which the Makefile contract tests
  run, verify it against a digest held here, and install it into
  `~/.cargo/bin`.

  The pin lives here and nowhere else. `.github/actions/cache-keys` hashes
  this file into the tool family's key, and `~/.cargo/bin` is in that family,
  so an exact tool-cache hit means the restored `makeutil` is this release.
  Callers therefore run this action only when the tool cache missed. Changing
  the pin changes the key, so the first run after a change misses and
  downloads rather than keeping a stale binary.

runs:
  using: composite
  steps:
    - name: Download the pinned makeutil release
      shell: bash
      env:
        # A static musl build, so it runs on any Linux image. The digest is
        # pinned here rather than read from the release's own `.sha256` file,
        # which would come from the same place as the binary it vouches for.
        MAKEUTIL_VERSION: 'v0.1.0'
        MAKEUTIL_TARGET: 'x86_64-unknown-linux-musl'
        MAKEUTIL_SHA256: '99dd28a138dbe07e88e4dc5dd3954e6b29b46cc959635311d326cb537253115d'
      # The binary is checked in a scratch directory and only then installed,
      # so a failed check leaves nothing on `PATH` for a later step to run.
      run: |
        set -euo pipefail
        download="$(mktemp -d)/makeutil"
        curl --fail --location --show-error --silent --output "${download}" \
          "https://github.com/leynos/makeutil/releases/download/${MAKEUTIL_VERSION}/makeutil-${MAKEUTIL_TARGET}"
        printf '%s  %s\n' "${MAKEUTIL_SHA256}" "${download}" | sha256sum --check
        install -D --mode=0755 "${download}" "${HOME}/.cargo/bin/makeutil"
