---
name: Install the Makefile parser
description: >-
  Build and install the pinned `makeutil`, which the Makefile contract tests
  run, into `~/.cargo/bin`.

  The pin lives here and nowhere else. `.github/actions/cache-keys` hashes
  this file into the tool family's key, and `~/.cargo/bin` is in that family,
  so an exact tool-cache hit means the restored `makeutil` was built from this
  revision with this toolchain. Callers therefore run this action only when
  the tool cache missed: a hit makes the build, and the nightly toolchain it
  needs, redundant. Changing the pin changes the key, so the first run after a
  change misses and rebuilds rather than keeping a stale binary.

runs:
  using: composite
  steps:
    - name: Build makeutil at the pinned revision
      shell: bash
      env:
        # makeutil has no release yet, so it is built from a commit, and the
        # commit must be one makeutil's `main` reaches. A commit no branch
        # reaches still builds until GitHub garbage-collects it, and then every
        # run breaks with no change here; the previous pin was such a commit.
        # The first command refuses a pin `main` does not reach, and since a
        # pin change changes the tool key, the pull request that makes the
        # change always runs it. The toolchain is the nightly makeutil's
        # Polonius borrow checking needs.
        MAKEUTIL_REVISION: '6e64f4fe84419705badc30baa5649cbb6f69a298'
        MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      # `set` restates what `shell: bash` already implies, so the ancestry
      # refusal stops the build however the script is invoked.
      run: |
        set -euo pipefail
        history="$(mktemp -d)"
        git -C "${history}" init --quiet
        git -C "${history}" fetch --quiet --filter=tree:0 \
          https://github.com/leynos/makeutil refs/heads/main
        git -C "${history}" merge-base --is-ancestor "${MAKEUTIL_REVISION}" FETCH_HEAD
        rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
        RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
          --git https://github.com/leynos/makeutil \
          --rev "${MAKEUTIL_REVISION}" \
          --locked \
          --force \
          makeutil
