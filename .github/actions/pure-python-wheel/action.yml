name: Build Pure Python Wheel and Sdist
description: >-
  Builds the source distribution and, from it, the pure Python wheel using uv,
  then uploads both as one artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place the built sdist and wheel
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
      with:
        enable-cache: false
    # Without --sdist or --wheel, uv builds the sdist first and then the wheel
    # from that sdist, so every run also proves the sdist is buildable.
    - name: Build sdist and wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        uv build --out-dir "${OUT_DIR}"
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.out-dir }}/*.whl
          ${{ inputs.out-dir }}/*.tar.gz
