name: Build Wheels
description: Builds native Python wheels using maturin and uploads them.
inputs:
  python-version:
    description: Python version to set up
    required: true
  target:
    description: Rust target triple for cross builds (optional)
    required: false
  artifact-name:
    description: Name of the uploaded artefact
    required: true
  wheelhouse:
    description: Output directory for built wheels
    required: false
    default: wheelhouse
  maturin-version:
    description: Maturin version to install
    required: false
    # Keep in sync with .github/workflows/build-wheels.yml and pyproject.toml.
    default: "1.15.0"
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
      with:
        toolchain: stable
    # No `target` archive: sccache is the single owner of compiler output
    # across this repository, and a `target` tree is invalidated far more often
    # than the registry it would be stored beside.
    - name: Cache native wheel build dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.cargo/registry
          ~/.cargo/git
        key: cuprum-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.maturin-version }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          cuprum-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.maturin-version }}-
    - name: Install maturin
      shell: bash
      env:
        MATURIN_VERSION: ${{ inputs.maturin-version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade "maturin==${MATURIN_VERSION}"
    - name: Build wheels with maturin
      shell: bash
      env:
        WHEELHOUSE: ${{ inputs.wheelhouse }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        args=(
          --release
          --out "${WHEELHOUSE}"
          --manifest-path rust/cuprum-rust/Cargo.toml
        )
        if [ -n "${TARGET}" ]; then
          args+=(--target "${TARGET}")
        fi
        maturin build "${args[@]}"
    - name: Upload wheel artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.wheelhouse }}/*.whl
