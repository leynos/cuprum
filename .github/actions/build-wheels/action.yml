name: Build Wheels
description: Builds native Python wheels using maturin and uploads them.
inputs:
  python-version:
    description: Python version to set up
    required: true
  target:
    description: Rust target triple for cross builds (optional)
    required: false
  artifact-name:
    description: Name of the uploaded artifact
    required: true
  wheelhouse:
    description: Output directory for built wheels
    required: false
    default: wheelhouse
  maturin-version:
    description: Maturin version to install
    required: false
    # Keep in sync with .github/workflows/build-wheels.yml and pyproject.toml.
    default: "1.13.3"
runs:
  using: composite
  steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
      with:
        toolchain: stable
    # No `target` archive: sccache is the single owner of compiler output
    # across this repository, and a `target` tree is invalidated far more often
    # than the registry it would be stored beside.
    - name: Cache native wheel build dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.cargo/registry
          ~/.cargo/git
        key: cuprum-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.maturin-version }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          cuprum-wheel-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ inputs.maturin-version }}-
    - name: Install maturin
      shell: bash
      run: python -m pip install --upgrade "maturin==${{ inputs.maturin-version }}"
    - name: Build wheels with maturin
      shell: bash
      run: |
        set -eu
        args=(
          --release
          --out "${{ inputs.wheelhouse }}"
          --manifest-path rust/cuprum-rust/Cargo.toml
        )
        if [ -n "${{ inputs.target }}" ]; then
          args+=(--target "${{ inputs.target }}")
        fi
        maturin build "${args[@]}"
    - name: Upload wheel artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.wheelhouse }}/*.whl
