version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      shared-actions:
        patterns:
          - 'leynos/shared-actions*'
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directories:
      - "/"
      - "/.github/actions/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Python (uv-managed pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Pylint 4.0.9 declares Astroid <=4.1.dev0, so Astroid 4.0.4 is pinned as a
    # mutually compatible pair with it (see pyproject.toml and ADR 003). A
    # bump of either alone breaks the pair; Astroid moves with Pylint by hand.
    ignore:
      - dependency-name: "astroid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "uv"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for the Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/rust"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
