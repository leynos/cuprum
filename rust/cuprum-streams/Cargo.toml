[package]
name = "cuprum-streams"
version = "0.1.0"
edition = "2024"
license = "ISC"
description = "Safe stream orchestration for Cuprum"
publish = false

[dependencies]
cuprum-native-io = { path = "../cuprum-native-io", version = "0.1.0" }
thiserror = "2.0.18"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
cap-std = "4.0.2"
insta = { version = "1.48.0", default-features = false }
proptest = "1.11.0"
rstest = "0.26.1"
tempfile = "3.27.0"
trybuild = { version = "1.0.116", features = ["diff"] }

# Cargo cannot override one lint while inheriting workspace lints. The
# boundary-contract gate requires these tables to match the workspace plus
# unsafe_code = "forbid", which applies to every current and future target.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
blanket_clippy_restriction_lints = "deny"
cognitive_complexity = "deny"
needless_pass_by_value = "deny"
implicit_hasher = "deny"

# 2. debugging leftovers
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# 3. panic-prone operations
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
string_slice = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"

# 4. portability
host_endian_bytes = "deny"
little_endian_bytes = "deny"
big_endian_bytes = "deny"

# 5. nursery idiom polish
let_underscore_must_use = "deny"
or_fun_call = "deny"
option_if_let_else = "deny"
self_named_module_files = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_lit_as_bytes = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
use_self = "deny"

# 6. numerical foot-guns
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
lossy_float_literal = "deny"

# 7. API ergonomics
missing_const_for_fn = "deny"
must_use_candidate = "deny"
unused_async = "deny"

# 8. Error handling
missing_panics_doc = "deny"
error_impl_error = "deny"
result_large_err = "deny"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.rustdoc]
missing_crate_level_docs = "deny"
