[package]
name = "cuprum-streams"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "ISC"
description = "Safe stream orchestration for Cuprum"
publish = false

[dependencies]
cuprum-native-io = { path = "../cuprum-native-io", version = "0.1.0" }
thiserror = "2.0.18"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
cap-std = "4.0.2"
insta = { version = "1.48.0", default-features = false }
proptest = "1.11.0"
rstest = "0.27.0"
tempfile = "3.27.0"
trybuild = { version = "1.0.116", features = ["diff"] }

# Safe-stream code retains `#![forbid(unsafe_code)]` in its crate root. The
# workspace intentionally does not impose that rule on the audited syscall and
# FFI boundaries, so every member can inherit one shared lint baseline here.
[lints]
workspace = true
