# Per-test allowance < global-timeout < cargo watchdog; see the developers'
# guide's "Test timeouts: the tiers this repository sets" section for rationale.
#
# This file lives beside the Cargo workspace manifest rather than at the
# repository root because nextest resolves .config/nextest.toml from the
# workspace root and searches no parent directory.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
global-timeout = "20m"

# `trybuild` compiles a scratch crate per UI case, so its tests are bounded by
# a build rather than by test work. They inherit RUSTFLAGS from the invoking
# `cargo`, which makes them several times slower under `make test`'s
# dev-fast flags (`--jobs 1`, `-C codegen-units=1`) than under the coverage
# lane's plain `-D warnings`. `compile_time_ui` measured 277 s locally against
# 62 s in CI, so the default 300 s allowance is too tight for them.
[[profile.default.overrides]]
filter = 'binary(compile_tests)'
slow-timeout = { period = "60s", terminate-after = 10 }
