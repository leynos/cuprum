# Per-test allowance < global-timeout < cargo watchdog; see the developers'
# guide's "Test timeouts: the tiers this repository sets" section for rationale.
#
# This file lives beside the Cargo workspace manifest rather than at the
# repository root because nextest resolves .config/nextest.toml from the
# workspace root and searches no parent directory.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
global-timeout = "20m"
