# Per-test allowance < global-timeout < cargo watchdog; see the developers'
# guide's "Test timeouts: the tiers this repository sets" section for rationale.
#
# This file lives beside the Cargo workspace manifest rather than at the
# repository root because nextest resolves .config/nextest.toml from the
# workspace root and searches no parent directory.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
global-timeout = "20m"

# `trybuild` compiles a scratch crate per UI case into `rust/target/tests/`,
# so its tests are bounded by a build rather than by test work. They inherit
# RUSTFLAGS from the invoking `cargo`, which makes them several times slower
# under `make test`'s dev-fast flags (`--jobs 1`, `-C codegen-units=1`) than
# under the coverage lane's plain `-D warnings`. A cold scratch tree cost
# `compile_time_ui` 124.884 s on a full `make test` and 277.049 s on a
# single-test run, against 62 s in CI with its caches warm, so the default
# 300 s allowance is too tight for them. The allowance is sized for the
# larger figure.
[[profile.default.overrides]]
filter = 'binary(compile_tests)'
slow-timeout = { period = "60s", terminate-after = 10 }
