# Per-test allowance < global-timeout < cargo watchdog; see
# docs/coverage-timeout-tiers.md for the tiers and their rationale.
#
# This file lives beside the Cargo workspace manifest rather than at the
# repository root because nextest resolves .config/nextest.toml from the
# workspace root and searches no parent directory.
#
# The floor is the release that first understood `global-timeout`. Nextest
# warns about configuration keys it does not recognize and keeps going, so
# an older release would drop the whole-run budget silently while every
# assertion still passed -- the failure this file exists to prevent. A
# declared floor turns that into a refusal to start. It is enforced by any
# nextest from 0.9.55; older releases ignore the declaration as well, and
# are refused by the Makefile checks instead.
nextest-version = "0.9.100"

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
global-timeout = "30m"

# `trybuild` compiles a scratch crate per UI case into `rust/target/tests/`,
# so its tests are bounded by a build rather than by test work. They inherit
# RUSTFLAGS from the invoking `cargo`, which makes them several times slower
# under `make test`'s dev-fast flags (`-C codegen-units=1`) than under the
# coverage lane's plain `-D warnings`. Earlier cold-build measurements were
# 124.884 s and 277.049 s, against 62 s in CI with its caches warm. A shared-
# queue gate on 2026-10-15 exceeded the 600 s allowance after nested Cargo
# waited on package-cache locks and the trybuild scratch build finished in
# 9m35s. A 2026-10-16 gate reached the 900 s allowance while nested Cargo
# still waited on that lock. The 1200 s allowance adds five minutes beyond
# that observed cutoff; the 30-minute run budget leaves time for the sibling
# UI test and the rest of the suite.
[[profile.default.overrides]]
filter = 'binary(compile_tests)'
slow-timeout = { period = "60s", terminate-after = 20 }
