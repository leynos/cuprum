[package]
name = "cuprum-native-io"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "ISC"
description = "Audited native resource and syscall boundary for Cuprum"
publish = false

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
rstest = "0.27.0"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
cap-std = "4.0.2"
# `std::io::pipe` replaced the direct `CreatePipe` call, so `Win32_System_Pipes`
# and the `Win32_Security` types its signature needed are no longer reachable
# from this crate. `Win32_Foundation` remains: handle observation queries it.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
