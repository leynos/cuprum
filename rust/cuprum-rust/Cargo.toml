[package]
name = "cuprum-rust"
version = "0.2.0-beta1"
edition = "2024"
rust-version.workspace = true
license = "ISC"
description = "Optional Rust extension for cuprum stream operations"
publish = false

[lib]
name = "_rust_backend_native"
crate-type = ["cdylib", "rlib"]

[features]
loom-defect-fixture = []

[dependencies]
cuprum-streams = { path = "../cuprum-streams", version = "0.1.0" }
cuprum-native-io = { path = "../cuprum-native-io", version = "0.1.0" }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
proptest = "1.11.0"
rstest = "0.27.0"
trybuild = { version = "1.0.116", features = ["diff"] }

[lints]
workspace = true
