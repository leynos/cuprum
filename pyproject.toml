[project]
name = "cuprum"
# When updating version, also update rust/cuprum-rust/Cargo.toml to match;
# CI verifies metadata parity between pure Python and native wheels.
version = "0.2.0-beta1"
description = "cuprum package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "ISC" }
authors = [{ name = "Payton McIntosh", email = "pmcintosh@df12.net" }]
dependencies = []

[project.urls]
Homepage = "https://df12.studio/docs.html"
Repository = "https://github.com/leynos/cuprum"

[dependency-groups]
dev = [
    "crosshair-tool",
    # Use the controlled v0.3.0 release tag; keep in step with
    # DF12_PYTHON_LINTS_REF in the Makefile.
    "df12-python-lints @ git+https://github.com/leynos/df12-python-lints.git@v0.3.0",
    "hypothesis>=6.163.0,<7.0",
    "hypothesis-crosshair",
    "interrogate",
    # The release-version property tests use it as an independent PEP 440
    # oracle, so declare it rather than rely on pytest pulling it in.
    "packaging>=25.0,<26.0",
    # Keep the isolated classic and DF12 Pylint environments on this released,
    # mutually compatible pair. Pylint declares Astroid <=4.1.dev0, so the
    # supported 4.0.4 pin is retained rather than forcing Astroid 4.3.1.
    "pylint==4.0.9",
    "astroid==4.0.4",
    # Constrained below pytest 9.1 until pytest-bdd supports its node-based
    # fixture-registration API; 9.1 deprecates the nodeid/baseid path that
    # pytest-bdd 8.1.0 uses, raising PytestRemovedIn10Warning.
    # Track: https://github.com/pytest-dev/pytest-bdd/issues/823
    "pytest<9.1",
    "pytest-benchmark",
    "pytest-bdd",
    # Keep the ruff and ty pins in step with RUFF_VERSION and TY_VERSION in
    # the Makefile and .github/workflows/ci.yml; the pin-parity contract test
    # in cuprum/unittests/test_toolchain_pins.py enforces the parity.
    "ruff==0.16.4",
    "pyright",
    "pytest-timeout",
    "pytest-xdist",
    "syrupy",
    "ty==0.0.74",
    # Keep in sync with .github/workflows/build-wheels.yml and
    # .github/actions/build-wheels/action.yml.
    "maturin==1.15.0",
    "pyyaml>=6.0.3",
    "cyclopts>=4.0",
]

[tool.ty.src]
# The duplication gate is isolated tooling, not application code. Its modules
# are declared for `>=3.14` in their PEP 723 headers and use `typing.TypeIs`
# and `PurePosixPath.full_match`, which do not exist at this project's 3.12
# floor; their tests run under the same 3.14 interpreter and use the same APIs,
# so they carry the same floor. Already-excluded files stay checked when named
# explicitly, so `make typecheck` runs them in their own pass at the
# interpreter they actually target; excluding them here only keeps the
# application pass honest about the floor the application itself supports.
exclude = [
    "scripts/atomic_write.py",
    "scripts/duplication_allowlist.py",
    "scripts/duplication_gate.py",
    "scripts/nose_detector.py",
    "scripts/nose_schema.py",
    "scripts/tests/duplication_gate_test_support.py",
    "scripts/tests/nose_detector_test_support.py",
    "scripts/tests/test_atomic_write.py",
    "scripts/tests/test_duplication_gate.py",
    "scripts/tests/test_duplication_gate_blocking.py",
    "scripts/tests/test_duplication_gate_commands.py",
    "scripts/tests/test_duplication_gate_make.py",
    "scripts/tests/test_duplication_gate_persistence.py",
    "scripts/tests/test_duplication_gate_properties.py",
    "scripts/tests/test_duplication_gate_seams.py",
    "scripts/tests/test_make_install_nose.py",
    "scripts/tests/test_nose_binary.py",
    "scripts/tests/test_nose_detector.py",
    "scripts/tests/test_nose_scope_contract.py",
    "scripts/tests/test_nose_settings.py",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "ASYNC",    # flake8-async: async-correctness lints (e.g. ASYNC109, ASYNC240)
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "DOC",      # Enforce docstring signature/return/yield/raises consistency
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "assert",
    "too-many-arguments",
    "too-many-positional-arguments",
    "magic-value-comparison",
    "no-self-use",
    # Test parameters fed by @pytest.mark.parametrize or Hypothesis @given
    # are data rows, not API flags; pytest's signature-based binding rules
    # out keyword-only parameters, so the boolean-trap rule does not apply.
    "boolean-type-hint-positional-argument",
]
# ASYNC109/ASYNC240 are ignored only for the two modules whose async
# scaffolding polls a PID/marker file with asyncio-only helpers, so a
# ``timeout`` parameter and blocking ``pathlib`` calls are acceptable there
# (trio/anyio async paths are not in use). Scoped to these paths so unrelated
# and future async tests do not silently inherit the exemption.
"cuprum/unittests/test_observe_stdin_early_close.py" = ["async-function-with-timeout", "blocking-path-method-in-async-function"]
"tests/behaviour/_execution_runtime_support.py" = ["async-function-with-timeout", "blocking-path-method-in-async-function"]
# Same rationale as above: the teardown test polls a cross-process marker
# file that no asyncio primitive can observe.
"cuprum/unittests/test_pipeline_teardown_cancellation.py" = ["blocking-path-method-in-async-function"]
"cuprum/unittests/*_test_helpers.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"cuprum/unittests/*_support.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"tests/steps/*.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.AbstractSet".msg = "Use collections.abc.Set instead of deprecated typing generics."
"typing.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead of deprecated typing generics."
"typing.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead of deprecated typing generics."
"typing.AsyncIterable".msg = "Use collections.abc.AsyncIterable instead of deprecated typing generics."
"typing.AsyncIterator".msg = "Use collections.abc.AsyncIterator instead of deprecated typing generics."
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead of deprecated typing generics."
"typing.Callable".msg = "Use collections.abc.Callable instead of deprecated typing generics."
"typing.ChainMap".msg = "Use collections.ChainMap instead of deprecated typing generics."
"typing.Collection".msg = "Use collections.abc.Collection instead of deprecated typing generics."
"typing.Container".msg = "Use collections.abc.Container instead of deprecated typing generics."
"typing.ContextManager".msg = "Use contextlib.AbstractContextManager instead of deprecated typing generics."
"typing.Coroutine".msg = "Use collections.abc.Coroutine instead of deprecated typing generics."
"typing.Counter".msg = "Use collections.Counter instead of deprecated typing generics."
"typing.DefaultDict".msg = "Use collections.defaultdict instead of deprecated typing generics."
"typing.Deque".msg = "Use collections.deque instead of deprecated typing generics."
"typing.Dict".msg = "Use dict instead of deprecated typing generics."
"typing.FrozenSet".msg = "Use frozenset instead of deprecated typing generics."
"typing.Generator".msg = "Use collections.abc.Generator instead of deprecated typing generics."
"typing.ItemsView".msg = "Use collections.abc.ItemsView instead of deprecated typing generics."
"typing.Iterable".msg = "Use collections.abc.Iterable instead of deprecated typing generics."
"typing.Iterator".msg = "Use collections.abc.Iterator instead of deprecated typing generics."
"typing.KeysView".msg = "Use collections.abc.KeysView instead of deprecated typing generics."
"typing.List".msg = "Use list instead of deprecated typing generics."
"typing.Mapping".msg = "Use collections.abc.Mapping instead of deprecated typing generics."
"typing.Match".msg = "Use re.Match instead of deprecated typing generics."
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead of deprecated typing generics."
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead of deprecated typing generics."
"typing.MutableSet".msg = "Use collections.abc.MutableSet instead of deprecated typing generics."
"typing.OrderedDict".msg = "Use collections.OrderedDict instead of deprecated typing generics."
"typing.Pattern".msg = "Use re.Pattern instead of deprecated typing generics."
"typing.Reversible".msg = "Use collections.abc.Reversible instead of deprecated typing generics."
"typing.Sequence".msg = "Use collections.abc.Sequence instead of deprecated typing generics."
"typing.Set".msg = "Use set instead of deprecated typing generics."
"typing.Tuple".msg = "Use tuple instead of deprecated typing generics."
"typing.Type".msg = "Use type instead of deprecated typing generics."
"typing.ValuesView".msg = "Use collections.abc.ValuesView instead of deprecated typing generics."

[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"

[tool.ruff.lint.pydoclint]
# Per repository convention (.rules/python-00.md), NumPy-format section
# docstrings are for public APIs; private helpers use concise single-line
# docstrings. Exempt one-line docstrings from the DOC signature checks so those
# private helpers need not carry Returns/Yields/Raises sections.
ignore-one-line-docstrings = true
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pylint.main]
# Activate rules whose behaviour depends on Cuprum's supported Python baseline.
py-version = "3.12"
# Expand directory targets like tests even when they are not packages.
recursive = true
# Match the project file-size ceiling enforced during review.
max-module-lines = 400

[tool.pylint.design]
# Keep function call surfaces small enough to understand without memorising
# positional argument order.
max-args = 5
# The new Pylint gate complements Ruff's stricter PLR0914 threshold without
# forcing broad refactors while introducing the additional rule families below.
max-locals = 20
# Use Pylint's statement-count proxy for function length; Pylint 4 does not
# expose a distinct physical-lines-per-function option.
max-statements = 70
# Keep positional call surfaces aligned with Ruff's existing argument limit.
max-positional-arguments = 4

[tool.pylint."messages control"]
# Keep this Pylint pass focused on the explicitly selected messages.
disable = [
    "all",
]
enable = [
    # Syntax errors must fail loudly: otherwise a Pylint 10.00/10 can mean no
    # module was analysed at all.
    "syntax-error",
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30

[tool.mutmut]
# Flat layout: the package lives at the repository root.
source_paths = ["cuprum/"]
# The suite is split between tests/ and the in-package unit tests.
pytest_add_cli_args_test_selection = ["tests/", "cuprum/unittests/"]
# cuprum/unittests/ is the in-package unit-test suite and
# cuprum/_testing.py is a test-only re-export surface for internal
# helpers; mutants in either would be noise.
do_not_mutate = ["cuprum/unittests/*", "cuprum/_testing.py"]
# mutmut runs pytest from mutants/; copy the assets the suite resolves
# relative to the repository root: the shared root conftest, the
# benchmarks package imported by the benchmark and profiling tests, the
# documentation exercised by the docs contract tests, the workflow and
# action files read by the maturin pin and ratchet tests, and the Rust
# tree the wheel-build snapshot test builds from (listed piecewise so a
# local rust/target/ build directory is never copied; the crate
# directory precedes the loose workspace files because mutmut creates
# parent directories only when copying directories).
also_copy = [
    "conftest.py",
    "benchmarks/",
    "docs/",
    ".github/",
    # test_changelog_records_cleanup_telemetry_contract reads the loose
    # root-level CHANGELOG.md, and test_toolchain_pins.py reads the
    # Makefile's tool-version defaults.
    "CHANGELOG.md",
    "Makefile",
    "rust/cuprum-rust/",
    "rust/cuprum-streams/",
    "rust/cuprum-native-io/",
    "rust/Cargo.toml",
    "rust/Cargo.lock",
    "rust/clippy.toml",
    "rust/dylint.toml",
]

[tool.uv]
package = true
[tool.skylos]

[tool.skylos.gate]
strict = true

[tool.skylos.whitelist.documented]
_check_rust_available = "Re-exported as the public is_rust_available backend probe."

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = [
    "cuprum.adapters.metrics_adapter.InMemoryMetrics.inc_counter.labels",
    "cuprum.adapters.metrics_adapter.InMemoryMetrics.observe_histogram.labels",
]
reason = "InMemoryMetrics preserves the MetricsCollector protocol signature while intentionally discarding labels."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "cuprum.adapters.logging_adapter._StructuredLoggingHook.report_pipeline_wait",
]
reason = "Called structurally through _PipelineWaitReporter by _StageObservation.report_pipeline_wait."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
    "cuprum._pipeline_native_pump_runtime._settle_native_pump_future",
]
reason = "Called by _PooledNativePumpExecutor._worker_loop from a daemon worker thread."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "cuprum._pipeline_native_pump_runtime._PooledNativePumpExecutor.submit",
    "cuprum._pipeline_native_pump_runtime._PooledNativePumpExecutor._take_worker",
    "cuprum._pipeline_native_pump_runtime._PooledNativePumpExecutor._start_worker",
    "cuprum._pipeline_native_pump_runtime._PooledNativePumpExecutor._worker_loop",
    "cuprum._pipeline_native_pump_runtime._PooledNativePumpExecutor._retire_or_reuse",
]
reason = "Reached only through _DEFAULT_NATIVE_PUMP_RUNTIME.executor, whose _NativePumpExecutor protocol type hides submit from the reference graph; the private helpers are reachable only from submit."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "cuprum._pipeline_native_pump_types._RustPumpState.defer_cleanup",
]
reason = "Called through _DeferredNativePumpCleanupState during cancellation cleanup."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "cuprum._pipeline_native_pump_types._RustPumpState.complete_cleanup",
]
reason = "Called through the native-pump completion callback's cleanup state."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
    "cuprum._pipeline_stream_fds._BlockingModeGuard.restore",
]
reason = "Invoked through the native cleanup callback when restoring descriptor modes."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
    "cuprum._pipeline_stream_fds._restore_stream_fd_blocking",
]
reason = "Called by the callback-owned _BlockingModeGuard.restore method."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
    "cuprum._streams_pump._override_read_size",
]
reason = "Called by benchmarks.tee_profile_worker while profiling the pump read loop."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
    "cuprum.adapters._tracing_line_stream._line_stream_attributes",
]
reason = "Called by TracingHook.record_line_stream_event, which callers register through observe_line_stream."

# The code-duplication gate. `make duplication` and `make lint` run the pinned
# `nose` binary through `scripts/duplication_gate.py` with these settings.
#
# `roots` is the shipped production package. Cuprum has no `src/` layout, so
# `cuprum/` is the import package itself; `tests/`, `benchmarks/` and
# `scripts/` are maintained but are not shipped, and are deliberately outside
# this first gate.
#
# `exclude` is matched relative to each configured root, *not* to the
# repository root: `unittests/**` excludes `cuprum/unittests`, while
# `cuprum/unittests/**` would silently match nothing and leave those files in
# the scan. See "Code-duplication gate" in docs/developers-guide.md.
#
# Every channel is named in `mode` so a change to nose's own defaults cannot
# widen or narrow what this gate checks. `min-size` counts nose IL tokens, not
# Python lines or AST nodes. `surface = "all"` reports the hidden-surface
# families as well as the curated dashboard; `top = 30` then adjudicates the
# 30 highest-ranked families *before* the allow entries below are applied, so
# an allowed family still occupies a place in that surface.
[tool.nose]
version = "0.20.0"
roots = ["cuprum"]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 30
exclude = ["unittests/**"]

# Reasoned exceptions to the duplication gate, applied after ranking.
#
# Each entry names locations by key, never by source line, so code moving above
# a finding does not invalidate the entry. A key is a repository-relative glob
# (`path`), optionally suffixed with `::name` to require nose's unit name as
# well. An entry sets exactly one of:
#
#   unit = "path[::name]"      one location
#   members = ["...", "..."]   two or more locations
#
# and silences a family only when EVERY reported location matches one of its
# keys. A family that grows a member outside the entry's keys blocks again, and
# a `::name` key never matches a fragment-level finding, which nose reports
# without a name. Every entry needs a non-empty `reason`.
#
# Entries that match no finding are reported by the gate. That report is not
# proof the duplication is gone: the ranking bound above caps what the gate
# observes, so confirm with source inspection before deleting an entry.
[tool.duplication_gate]

# --- Import declarations -------------------------------------------------
#
# Import statements cannot be factored into a shared helper. Re-importing the
# same names from a common module would not remove the per-module binding, and
# the only other "shared" form — a wildcard re-export — trades a reviewable
# import list for an invisible one. Each block below is a distinct module's
# declared dependency surface, so an entry names every module in the family.

[[tool.duplication_gate.allow]]
members = [
    "cuprum/context/registration.py",
    "cuprum/_line_iteration.py",
    "cuprum/_pipeline_native_pump_types.py",
    "cuprum/_line_stream/telemetry.py",
    "cuprum/_pipeline_results.py",
    "cuprum/_line_stream/line_queue.py",
    "cuprum/_pipeline_config.py",
    "cuprum/_stream_line_consumer.py",
    "cuprum/adapters/pump_metrics.py",
]
reason = "Nine modules whose `if TYPE_CHECKING:` guard opens the same way. The bodies name different types and the guard is the only shared part; import declarations cannot be factored into a shared helper."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_line_stream/spawn.py",
    "cuprum/_pipeline_collect.py",
    "cuprum/_subprocess_streams.py",
    "cuprum/_subprocess_wait.py",
]
reason = "The same four-module TYPE_CHECKING header. Each module imports its own collaborators; only the `import types`/`import collections.abc as cabc` prologue repeats."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/stream_observation.py",
    "cuprum/adapters/stream_metrics.py",
]
reason = "Two modules importing the four names of the stream-event vocabulary. The shared block is the vocabulary's public surface, which both must bind to their own module."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_streams.py",
    "cuprum/_streams_pump.py",
]
reason = "Two stream drivers that import the three stream-operation recorders plus the same type-only measurement import. The import list is the whole overlap; the drivers diverge immediately below it."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/__init__.py",
    "cuprum/adapters/line_stream_metrics.py",
]
reason = "The package's public surface and an adapter's import of the same four line-stream names. The re-export is the package's documented purpose."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_line_stream/__init__.py",
    "cuprum/_line_stream/coordinator.py",
]
reason = "A package re-export and its own coordinator importing the same submodule names. The `__init__` exists to re-export them; a coordinator that took them from the package would import itself."

# --- Parallel structures -------------------------------------------------
#
# These are families whose members are genuinely similar in shape but are not
# one implementation written twice: they carry different data, different
# public contracts, or both. Extracting them would create the generic utility
# or cross-layer dependency the adoption boundary forbids.

[[tool.duplication_gate.allow]]
members = [
    "cuprum/context/registration.py::before",
    "cuprum/context/registration.py::after",
    "cuprum/context/registration.py::observe",
]
reason = "Three registration factories whose one-line bodies call the same handle constructor. Each carries a distinct hook type and a distinct documented signature, and each is a public API entry point; a parameterized factory would erase the signatures the public API documents."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/adapters/echo_metrics.py::__init__",
    "cuprum/adapters/line_stream_metrics.py::__init__",
    "cuprum/adapters/metrics_adapter.py::__init__",
    "cuprum/adapters/pump_metrics.py::__init__",
    "cuprum/adapters/stream_metrics.py::__init__",
]
reason = "Five adapter constructors that each bind their own collector to the name `_collector`. A shared base would put five unrelated adapters in one inheritance hierarchy to save five identical assignments."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/events.py::ExecEvent",
    "cuprum/line_stream_events.py::LineStreamEvent",
    "cuprum/_pipeline_types.py::_EventDetails",
]
reason = "Three distinct event schemas. The overlap is the shape every event record shares — an identifier, a phase, an optional payload — not one schema written three times. No field is interchangeable between them."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_pipeline_config.py::_PipelineRunConfig",
    "cuprum/_subprocess_execution.py::_SubprocessExecution",
]
reason = "Two execution bundles whose overlapping fields are exactly the public run options — capture, echo, max_echo_line_bytes, timeout, on_line, idle — that the pipeline path and the direct-run path each independently require. Pipeline execution already depends on subprocess execution, so a shared base would deepen that layered dependency in the forbidden direction to remove field repetition."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/builders/tar.py::tar_create",
    "cuprum/builders/tar.py::tar_extract",
]
reason = "Two tar builders that share a docstring skeleton and a boolean-flag normalization. Their argv, option schemas (`TarCreateOptions` against `destination`/`allow_relative`) and return contracts differ; the visible overlap is the numpydoc shape every builder in the package uses."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/adapters/_support.py::_event_common_fields",
    "cuprum/adapters/_support.py::_verbatim_fields",
]
reason = "Two halves of one projection, split on purpose: one yields the fields every event carries, the other the optional fields passed through unchanged. One is an iterator and one a tuple, and the split is what keeps the rendering rule — which fields are coerced, which pass through — visible in one place."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/echo_observation.py::_discard_echo_hook_result",
    "cuprum/stream_observation.py::_discard_hook_result",
]
reason = "Two hook-result reporters, one per observation channel. Each logs the channel's own event fields (`event.stream` against `event.operation`) under its own log action, and the family value has already fallen to 16.3 from the shared shape alone. Merging them would couple two channels whose log records are separately observable API."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/line_stream_observation.py",
    "cuprum/pump_observation.py",
]
reason = "The same warning record — action, phase, result type — emitted by two observation channels. The log message and every `extra` key are per-channel, and both channels are separately observable, so the shared text is the house log format rather than a shared implementation."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_pipeline_stream_fds.py::_close_rust_writer_fd",
    "cuprum/_pipeline_stream_fds.py::_close_native_pump_worker_fd",
    "cuprum/_pipeline_stream_fds.py::_close_rust_reader_fd",
    "cuprum/_pipeline_stream_fds.py::_close_rust_state_fd",
    "cuprum/_streams_rs.py::_close_writer_after_pre_native_failure",
]
reason = "Five one-line fd closers. Each names one descriptor's ownership boundary in its name and docstring, and four of the five are monkeypatch seams that the cleanup tests patch by name. A single closer parameterized by descriptor would delete the names the tests target."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_idle_heartbeat.py",
    "cuprum/_pipeline_stream_fds.py",
    "cuprum/_sink_lifecycle.py",
    "cuprum/context/_policy.py",
    "cuprum/context/env_overlay.py",
]
reason = "`if <field> is None: return None` over five different fields in five modules: an interval, a stream, a sink, a timeout, an overlay. The guard is the None-tolerance idiom this codebase uses at every optional-parameter boundary, not one shared operation."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_pipeline_stream_native_cleanup.py",
    "cuprum/_pipeline_wait_records.py",
    "cuprum/_sink_lifecycle.py",
    "cuprum/_timeout_reporting.py",
]
reason = "`if <field> is None: return` over five call sites in four modules: native fds, an observation (twice), a session, an observation. Each is a same-module early return guarding a different optional collaborator; the shared text is the guard idiom, not a shared operation."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/_pipeline_types.py",
    "cuprum/_streams_rs.py",
    "cuprum/context/_policy.py",
]
reason = "Three modules that each repeat one two-line early return twice within themselves (`if not self.hooks.observe_hooks: return`, `if os.name != 'nt': return fd`/`writer_fd`, `if config is None: return parent`). Each pair is a same-file guard whose two instances read different fields; the detector groups the pairs, not one repeated implementation."

# The three families below each group two findings that share one key, so the
# entry is a `unit` even though the family has two members.
[[tool.duplication_gate.allow]]
unit = "cuprum/_pipeline_native_pump_types.py::__init__"
reason = "Two exception constructors in one module that store the original error and pass its text to `super()`. Each is the initializer of a distinct exception type with a distinct docstring naming a distinct failure (descriptor duplication against blocking-mode refusal); a shared base class would make two unrelated errors related to save one line."

[[tool.duplication_gate.allow]]
unit = "cuprum/sh/safe_cmd.py::__or__"
reason = "`SafeCmd.__or__` and `Pipeline.__or__` both delegate to `Pipeline.concat`. The shared line is a fluent operator the public API documents on each type; routing both through a third helper would hide the delegation behind a name with no meaning of its own."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/adapters/_metrics_operations.py::__init__",
    "cuprum/catalogue.py::__init__",
]
reason = "Two exception constructors that build a message and pass it to `super()`. They store different attributes (`phase` against `project_name`), interpolate different text, and belong to modules that do not import each other."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/context/_scope.py::__post_init__",
    "cuprum/context/core.py::__post_init__",
]
reason = "Two frozen dataclasses whose post-init validates and coerces the same two scope fields. Their bodies are now one-line delegations to `_normalize_scope_fields`. What the detector still matches is the delegation itself plus the shared docstring line; the class name each passes is the only difference, and it is what keeps each type's timeout diagnostic naming its own type."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/adapters/_tracing_native_pump_cleanup.py",
    "cuprum/adapters/_tracing_line_stream.py",
]
reason = "Two tracing mixins that cast `self` to `TracingHook` and look up the active span before recording. The lookup is the already-shared helper; what remains is the per-channel guard that decides whether this event is worth recording at all, which differs between the two."

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["cuprum/unittests/**"]
# Ship the optional native workspace without including Cargo build artefacts.
source-include = [
    "rust/Cargo.toml",
    "rust/Cargo.lock",
    "rust/clippy.toml",
    "rust/rust-toolchain.toml",
    "rust/dylint.toml",
    "rust/cuprum-rust/Cargo.toml",
    "rust/cuprum-rust/src/**",
    "rust/cuprum-rust/tests/**",
    "rust/cuprum-streams/Cargo.toml",
    "rust/cuprum-streams/src/**",
    "rust/cuprum-streams/tests/**",
    "rust/cuprum-native-io/Cargo.toml",
    "rust/cuprum-native-io/src/**",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/cuprum-rust/Cargo.toml"
module-name = "cuprum._rust_backend_native"
python-source = "."
exclude = ["cuprum/unittests/**"]
include = [
    { path = "rust/clippy.toml", format = "sdist" },
    { path = "rust/rust-toolchain.toml", format = "sdist" },
    { path = "rust/dylint.toml", format = "sdist" },
]
