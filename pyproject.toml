# The code-duplication gate. `make duplication` and `make lint` run the pinned
# `nose` binary through `scripts/duplication_gate.py` with these settings.
#
# `roots` is the shipped production package. Cuprum has no `src/` layout, so
# `cuprum/` is the import package itself; `tests/`, `benchmarks/` and
# `scripts/` are maintained but are not shipped, and are deliberately outside
# this first gate.
#
# `exclude` is matched relative to each configured root, *not* to the
# repository root: `unittests/**` excludes `cuprum/unittests`, while
# `cuprum/unittests/**` would silently match nothing and leave those files in
# the scan. See "Code-duplication gate" in docs/developers-guide.md.
#
# Every channel is named in `mode` so a change to nose's own defaults cannot
# widen or narrow what this gate checks. `min-size` counts nose IL tokens, not
# Python lines or AST nodes. `surface = "all"` reports the hidden-surface
# families as well as the curated dashboard.
#
# `top = 0` is nose's unbounded spelling and adjudicates the whole surface.
# It is not an empty request, and it is not the same as omitting the term:
# omitting it falls back to nose's default view of 30, which truncates the
# `families` array exactly as a small explicit bound does. The gate refuses a
# truncated report outright rather than adjudicating it (see
# `require_untruncated_surface`), so a bound that binds is a configuration
# error instead of a silently narrowed scan.
#
# A bound is not merely a narrower view. The stale-entry report is computed
# from the families the scan returned, so a family hidden below the bound
# leaves its allow entry matching nothing and the gate tells the maintainer to
# *delete* a reasoned exception whose duplication is still present. Measured on
# this tree: the full surface is 62 families covered by 50 entries with nothing
# stale, while re-adjudicating that same report at `top = 30` emits 30 of the
# 62 and falsely reports 23 of those 50 entries as stale. `top = 0` is what
# removes the failure mode, not a larger number. See ADR-022.
[tool.nose]
version = "0.20.0"
roots = ["cuprum"]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 0
exclude = ["unittests/**"]

# Reasoned exceptions to the duplication gate, applied after ranking.
#
# Each entry names locations by key, never by source line, so code moving above
# a finding does not invalidate the entry. A key is a repository-relative glob
# (`path`), optionally suffixed with `::name` to require nose's unit name as
# well. An entry sets exactly one of:
#
#   unit = "path[::name]"      one location
#   members = ["...", "..."]   two or more locations
#
# and silences a family only when EVERY reported location matches one of its
# keys. A family that grows a member outside the entry's keys blocks again, and
# a `::name` key never matches a fragment-level finding, which nose reports
# without a name. Every entry needs a non-empty `reason`.
#
# Entries that match no finding are reported by the gate. With the surface
# unbounded above, every family the scan found is matched against this list, so
# a reported entry genuinely covers nothing. Confirm with source inspection
# before deleting it anyway: a family can leave the surface on a refactor that
# does not itself duplicate anything, and absence from one scan is not proof
# the duplication is gone.
[tool.duplication_gate]

