members = [
    "cuprum/line_stream_events.py",
    "cuprum/control_events.py",
]
reason = "Two closed event vocabularies whose import prologues — `collections.abc`, `dataclasses`, `enum`, `typing`, and the type-only `ExecId` — are the same. Their members, values and outcome enums differ entirely, and each module documents why its vocabulary is closed and separate. Import declarations cannot be factored."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/control_events.py",
    "cuprum/stream_events.py",
]
reason = "Two more closed vocabularies importing the same prologue and declaring a `StrEnum` with the same keyword line. The member names, values and outcome enums are per-channel; the shared text is the module preamble and one class statement."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/context/core.py",
    "cuprum/context/_scope.py",
]
reason = "Two scope modules binding the same overlay names and carrying the same type-only import block. The pair already has an entry for the `__post_init__` family, whose real overlap was extracted into `_normalize_scope_fields`; what remains here is the import prologue, which cannot be factored."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/adapters/control_metrics.py",
    "cuprum/adapters/stream_metrics.py",
]
reason = "Two metric adapters whose import blocks and recorder-name lists overlap. Each adapter binds the names of its own event vocabulary and registers its own collector; the shared text is the import list, not a shared implementation."

[[tool.duplication_gate.allow]]
members = [
    "cuprum/sh/results.py",
    "cuprum/sh/byte_results.py",
]
reason = "The buffered and bytes result records, split across two modules when the text records outgrew the 400-line ceiling: `CommandResult ~ BytesCommandResult`, whose field skeleton, keyword-only declarations and `ok` property are the same with only the `stdout`/`stderr` element types differing, and `PipelineResult ~ BytesPipelineResult`, whose stage, failure and output properties differ only in the stage type they return. `_result_types.py` states that the bytes forms deliberately do not subclass the buffered ones, the public-API tests pin each type's `dc.fields()` order and positional slots, and the differing annotations are asserted. A shared base would re-order those fields and cap the annotations, and the only shared logic is a one-line `ok` and property bodies that already delegate to `self.final`; a generic base would replace two concrete public types with a parameterized one. This replaces the single-module `unit` entry that covered the same two families before `byte_results.py` was split out, so the entry is keyed by both modules rather than one path."
[[tool.duplication_gate.allow]]
members = ["cuprum/_process_signal.py", "cuprum/adapters/_tracing_control_join.py"]
reason = "A two-line `if <field> is None: return` guard in two unrelated modules: one declines to report a teardown for a run with no report to file, the other declines to record an event with no execution to attribute it to. The shared text is the None-tolerance guard this codebase uses at every optional-collaborator boundary — the same idiom the seven-module and two-module entries elsewhere in this list adjudicate — not a shared operation. Neither module has a collaborator to hand the guard, and collapsing them would mean one module importing the other only to restate two lines."
[[tool.duplication_gate.allow]]
members = ["cuprum/_command_internals.py", "cuprum/_pipeline_observation.py"]
reason = "Two modules whose import prologue repeats: the same five-name `from cuprum._observability import (...)` re-import, followed by the same `_pipeline_types` and `_subprocess_context` imports. Import declarations cannot be factored into a shared helper — re-importing from a common module would not remove the per-module binding, and a wildcard re-export would trade a reviewable list for an invisible one — for the reason the import-family entries above record. Each block is that module's declared dependency surface; the observation code below them diverges."

[[tool.duplication_gate.allow]]
members = ["cuprum/_pipeline_finalize.py", "cuprum/_command_finalization.py"]
reason = "The same prologue in the pipeline and command finalization modules: an `_observability` import of the two shutdown helpers (`_drain_tasks_during_cleanup`, `_wait_for_exec_hook_tasks`) that every finalizer needs to stop hook tasks, before each declares its `TYPE_CHECKING` block. Two modules, two different result families, one dependency surface; import declarations cannot be shared, for the reason the import-family entries above record. The finalization ordering below the imports is where the two deliberately part company."

[[tool.duplication_gate.allow]]
members = ["cuprum/sh/bytes_entry_points.py", "cuprum/sh/pipeline.py", "cuprum/sh/safe_cmd.py"]
reason = "Three synchronous entry points that end in an `asyncio.run(...)` over an async twin with the same four keywords. The matched text is the tail of the public method — the call and its forwarded arguments — not a shared implementation; a shared `_run_sync(awaitable)` would be a pure delegate that deletes the signatures the public API documents, the shape the `__or__` entry above records. The fragments carry no name, so this entry is keyed by whole module: `bytes_entry_points.py` is where this branch's split moved `run_bytes_sync`, and `pipeline.py ~ safe_cmd.py` is the pair `main` already reports at the same tail."

[[tool.duplication_gate.allow]]
members = ["cuprum/sh/stdio.py::path_value", "cuprum/sh/stdio.py::fd_value"]
reason = "Two properties on one target type that each refuse the wrong variant with an `f\"StdioTarget.{self.kind}() carries no …\"` message and then cast the payload. They differ in the kind they accept, the noun in the message, and the cast type; a shared helper would have to be told all three, which is the whole body. Each property's documented `Raises` section names the variant it refuses, so the two are a reviewable pair rather than one operation written twice."

[[tool.duplication_gate.allow]]
members = ["cuprum/sh/stdio.py::pipe", "cuprum/sh/stdio.py::inherit"]
reason = "Two one-line static constructors, each returning a distinct `kind` literal. The matched text is the signature, the docstring, and `StdioTarget(kind=...)`; a shared constructor would need the kind passed in, so callers would write `StdioTarget.pipe()` as `_variant(\"pipe\")` and lose the named variant the public API exposes."

[[tool.duplication_gate.allow]]
members = ["cuprum/_subprocess_context.py::_cwd_arg", "cuprum/adapters/_support.py::_rendered_value"]
reason = "Two total functions that map an optional value through `str`, one `str(cwd) if cwd is not None else None` and one `None if value is None else str(value)`. The matched text is the None-tolerance idiom this codebase uses at every optional-parameter boundary — the same idiom the None-guard entries above adjudicate — not a shared operation: one converts a path for a spawn keyword, the other renders an event field, and a helper accepting either would have to be generic over both meanings."

[[tool.duplication_gate.allow]]
members = ["cuprum/_rusage.py", "cuprum/sh/stdio_rules.py"]
reason = "One two-line conjunction guard in each module: a resource delta refused when either snapshot is missing, a contested-stdin check refused when either stream is missing. The shared text is `if a is None or b is None`, the None-tolerance idiom recorded throughout this list, not a shared operation; the bodies that follow compute a child's CPU delta and compare two stdio targets, and neither can use the other's."

[[tool.duplication_gate.allow]]
members = ["cuprum/_pipeline_stream_fds.py", "cuprum/redaction.py"]
reason = "The detector reports this as an unnamed fragment, so the exception must use these two exact paths. Each span is the canonical object.__setattr__ field initialization of a frozen, slotted dataclass: RedactionPolicy stages flexible rule inputs for __post_init__ validation, while _ReaderPause derives transport hand-off state. Sharing a helper or base would couple unrelated models; a field loop would hide the named invariants."

# uv_build builds the pure-Python wheel; CI builds native wheels through the
# maturin CLI. The direct builds set MATURIN_NO_MISSING_BUILD_BACKEND_WARNING
# because the declared PEP 517 backend is uv_build by design.

[[tool.duplication_gate.allow]]
members = ["cuprum/_command_finalization.py", "cuprum/_line_iteration.py"]
reason = "The direct command finalizer and the async line-stream iterator each bind the same lifecycle, observer-drain, and sink-outcome imports. Imports must bind in each module namespace; a common re-export would add an indirect dependency without removing those bindings. Their runtime completion paths remain deliberately separate."
[[tool.duplication_gate.allow]]
unit = "cuprum/adapters/echo_metrics.py"
reason = "The adjacent metric calls intentionally keep the public broken-pipe and truncation counters separate because each describes a different fault and uses a different label contract; the detector reports both fragments anonymously, so this path is the narrowest available key."
[[tool.duplication_gate.allow]]
members = ["cuprum/_group_teardown.py", "cuprum/_pipeline_stream_native_cleanup.py", "cuprum/_pipeline_wait_records.py", "cuprum/_sink_lifecycle.py", "cuprum/_timeout_reporting.py"]
reason = "`if <field> is None: return` in six places across five modules: an observation (three times, in two modules), native file descriptors, a session, and a teardown report. Each is a same-module early return guarding a different optional collaborator, and the shared text is the None-tolerance guard idiom this codebase uses at every optional-collaborator boundary, not a shared operation. The two `_pipeline_wait_records.py` matches remain separately named under one module. The `output_rules.py` match was removed when the shared positive-bound validator replaced its early return. Widened rather than extracted for the reason the seven-module and two-module siblings above record."
[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = ["cuprum/unittests/**"]
# Ship the optional native workspace without including Cargo build artefacts.
source-include = [
    "rust/Cargo.toml",
    "rust/Cargo.lock",
    "rust/clippy.toml",
    "rust/rust-toolchain.toml",
    "rust/dylint.toml",
    "rust/cuprum-rust/Cargo.toml",
    "rust/cuprum-rust/src/**",
    "rust/cuprum-rust/tests/**",
    "rust/cuprum-streams/Cargo.toml",
    "rust/cuprum-streams/src/**",
    "rust/cuprum-streams/tests/**",
    "rust/cuprum-native-io/Cargo.toml",
    "rust/cuprum-native-io/src/**",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/cuprum-rust/Cargo.toml"
module-name = "cuprum._rust_backend_native"
python-source = "."
exclude = ["cuprum/unittests/**"]
include = [
    { path = "rust/clippy.toml", format = "sdist" },
    { path = "rust/rust-toolchain.toml", format = "sdist" },
    { path = "rust/dylint.toml", format = "sdist" },
]
