# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Abbreviated Git commit SHAs, which the ExecPlans cite constantly. Typos
  # tokenizes before applying this list, so a SHA such as `a6b8ba14` splits into
  # letter runs and `ba` is read as a misspelling of "be"/"by" — any SHA whose
  # letters happen to spell a dictionary word collides, which makes this a
  # recurring class rather than a one-off. The leading digit is what keeps the
  # rule narrow: no English word begins with a digit, so ordinary prose stays
  # checked, unlike a bare `[0-9a-f]{7,40}`. Typos' regex engine has no
  # lookahead, so the leading digit is expressed by consuming it rather than by
  # asserting it.
  '[0-9][0-9a-f]{6,39}',
  # markdownlint-cli2 follows this fixed external environment variable.
  '\bFORCE_COLOR\b',
  # GitHub's Actions API and the established CLI expose these literal names.
  '"artifacts"',
  '"artifact"',
  'Upload main benchmark baseline artifact',
  'baseline-artifact',
  '\bartifact_dir\b',
  '/artifacts(?:[/?#"`]|$)',
  '--artifact-name(?:[=\s"`]|$)',
  # The upstream `actions/download-artifact` and `actions/upload-artifact`
  # action names, matched by prefix in workflow contract tests.
  'actions/(?:download|upload)-artifact@',
  # Composite-action input key and its `${{ inputs.* }}` reference; renaming it
  # would break every caller in .github/workflows.
  '\bartifact-name\b',
  # GitHub's pull_request activity types are literal event names.
  'types: \[opened, reopened, synchronize, labeled, ready_for_review\]',
  # Spelling-policy tests must contain the deliberately invalid input tokens.
  'mappings\["organise"\]',
  '\("teh", "(?:the|ten)"\)',
  '\("ises", "izes"\)',
  # This byte-splitting fixture deliberately divides "second" after "sec".
  'b"ond\\n"',
  # The shared base no longer exempts inline code spans wholesale, so the
  # identifiers below — a helper name, a third-party command-line flag, and
  # the style guide's own US-spelled API example — are exempted one at a time.
  # Prefer another narrow pattern to reinstating a blanket rule: prose inside
  # backticks should still be spell-checked.
  '\bbuild_native_wheel_artifact\b',
  '--artifact-server-path(?:[=\s"`]|$)',
  # These names are quoted external documentation titles.
  'Azure\s+Architecture\s+Center\s*\|\s*Microsoft\s+Learn\b',
  'GitHub\s+Flavored\s+Markdown\b(?:\s\(GFM\))?',
  # Cargo fixes this command-line flag's US spelling; ordinary prose remains
  # checked.
  '--color(?:[=,\s"]|$)',
  '`color`',
  '\brust-analyzer\b',
  # `mold` is the fixed external linker name. Typos tokenizes words before
  # applying this list, so each expression carries enough linker-specific
  # syntax to retain ordinary-prose checks for the word on its own.
  '`mold`',
  '"mold"',
  'checksum-verified mold binary',
  'unsupported mold architecture',
  'Only the Linux debug route selects Cranelift and mold',
  '\bDEV_FAST_MOLD_VERSION(?:_(?:FILE|PATTERN))?\b',
  '\bMOLD_VERSION\b',
  '_write_mold_metadata',
  '\bmissing_mold\b',
  '\bwrong_mold_version\b',
  # The prerequisite tests name their fixture and template placeholders after
  # the linker; each form carries identifier or template syntax, so prose uses
  # of the word on its own remain flagged.
  '\bmold_version\b',
  '\bmold \{version\}',
  '\bmold \{mold_version\}',
  'command -v mold',
  'mold --version',
  '\^mold \$',
  'mold %s is required',
  '-fuse-ld=mold',
  '\bmold 2\.41\.0\b',
  '\bmold 2\.41\.00\b',
  '"mold\\t--version"',
  '\bmold-\$\{version\}-\$\{architecture\}-linux\.tar\.gz\b',
  '\bmold-\{MOLD_VERSION\}-\{canonical\}-linux\.tar\.gz\b',
  '\bmold-\d+\.\d+\.\d+-(?:x86_64|aarch64)-linux\.tar\.gz\b',
  '\bmold \{MOLD_VERSION\}',
  'mold selection',
  'mold linker flag',
  'mold release',
  'mold ships',
  'upstream mold binaries',
  'downloaded mold',
  '\btools/mold/',
]

# ADR 009 requires en-GB-oxendict spelling in source identifiers, so the fenced
# block mask must not reach Python or Rust files. `markdown_only` withholds it
# from `[default] extend-ignore-re` and renders it under a `[type.markdown]`
# table scoped to `*.md` instead. Inline code spans stay checked everywhere,
# per the narrow-pattern preference recorded above.
markdown_only = [
  '(?s)```.*?```',
]

[files]
exclude = [
  # Syrupy snapshot of the byte-fidelity fixture: a random base64 payload
  # whose substrings collide with dictionary words. Not maintained prose.
  # Other `.ambr` snapshots hold maintained user-visible strings (warnings,
  # benchmark summaries) and stay spell-checked under the all-tracked-files
  # policy.
  "tests/behaviour/__snapshots__/test_stream_fidelity.ambr",
]
