# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # GitHub's Actions API and the established CLI expose these literal names.
  '"artifacts"',
  '"artifact"',
  'Upload main benchmark baseline artifact',
  'baseline-artifact',
  '\bartifact_dir\b',
  '/artifacts(?:[/?#"`]|$)',
  '--artifact-name(?:[=\s"`]|$)',
  # Composite-action input key and its `${{ inputs.* }}` reference; renaming it
  # would break every caller in .github/workflows.
  '\bartifact-name\b',
  # GitHub's pull_request activity types are literal event names.
  'types: \[opened, reopened, synchronize, labeled, ready_for_review\]',
  # Spelling-policy tests must contain the deliberately invalid input tokens.
  'mappings\["organise"\]',
  '\("teh", "(?:the|ten)"\)',
  '\("ises", "izes"\)',
  # This byte-splitting fixture deliberately divides "second" after "sec".
  'b"ond\\n"',
  # The shared base does not exempt inline code spans in source, so the
  # identifiers below — a helper name, a third-party command-line flag, and
  # the style guide's own US-spelled API example — are exempted one at a time.
  # Prefer another narrow pattern to a blanket rule here: these entries apply
  # to Python and Rust source as well as Markdown.
  '\bbuild_native_wheel_artifact\b',
  '--artifact-server-path(?:[=\s"`]|$)',
  '`color`',
  '\brust-analyzer\b',
]

# ADR 009 requires en-GB-oxendict spelling in source identifiers, so the code
# span masks below must not reach Python or Rust files. `markdown_only`
# withholds them from `[default] extend-ignore-re` and renders them under a
# `[type.markdown]` table scoped to `*.md` instead.
markdown_only = [
  '(?s)```.*?```',
  '`[^`\n]+`',
]

[files]
exclude = [
  # Syrupy snapshots of byte-fidelity fixtures: random base64 payloads whose
  # substrings collide with dictionary words. Not maintained prose.
  "*.ambr",
]
