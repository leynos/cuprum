# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # GitHub's Actions API and the established CLI expose these literal names.
  '"artifacts"',
  '/artifacts(?:[/?#]|$)',
  '--artifact-name(?:[=\s"`]|$)',
  # Spelling-policy tests must contain the deliberately invalid input tokens.
  'mappings\["organise"\]',
  '\("teh", "(?:the|ten)"\)',
  '\("ises", "izes"\)',
  # This byte-splitting fixture deliberately divides "second" after "sec".
  'b"ond\\n"',
  # Inline code spans quote identifiers verbatim (`color`, `--artifact-name`);
  # their spelling is the quoted API's, not this repository's prose policy.
  '`[^`\n]+`',
]

[files]
exclude = []
