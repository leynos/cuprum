# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# The shared base no longer exempts inline code spans wholesale, so the
# identifiers below — a helper name, a third-party command-line flag, and the
# style guide's own example of a US-spelled API name — are exempted one at a
# time. Prefer adding another line here to reinstating a blanket rule: prose
# inside backticks should still be spell-checked.
ignore = [
  '\bbuild_native_wheel_artifact\b',
  '--artifact-server-path',
  '`color`',
]

[files]
exclude = []
