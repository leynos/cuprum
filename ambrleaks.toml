[allowlist]
# Deterministic base64 fixture lines are public test data. These two lines begin
# with slash-separated segments that resemble POSIX paths to the scanner.
values = [
    '^/e6y2XJJDpMXP8Cs5eXFz/SRVOMwLLauMMNBYkoaAd/BVdz5b5/ggZ5KepdLZLVr$',
    '^/6a\+G1dAD\+nKUASogWl5FzyCB8H90WGN/C9Ymex2Lk\+/tldn1J3jgixVTWvW/8W4$',
    # The executable-binding fixtures name ``/opt/tools/<program>`` as the
    # approved executable path. The directory is fictional -- no machine binds
    # anything there -- so the value is deterministic public test data rather
    # than an accidental host path. It is deliberately not redacted: the
    # projection snapshot exists to pin the exact spelling each adapter
    # publishes the executed path under, which a placeholder would erode.
    '^/opt/tools/[^/]+$',
    # The installer snapshot pins the detector's upstream repository, which the
    # Makefile already names twice in the clear: once in the comment above
    # ``NOSE_VERSION`` and once as the ``--git`` argument of the ``install-nose``
    # recipe. It is a public source URL rather than a credential, and it is
    # deliberately not redacted: the snapshot exists to pin the exact source the
    # installer is told to fetch, so a placeholder would erode the contract the
    # test is there to enforce.
    '^https://github\.com/corca-ai/nose$',
]
